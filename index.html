/* ---------- timeline ---------- */
function vTimeline(){
  const z = state.settings.zoom, showUnd = !state.settings.hideUndated;
  let ps = active().filter(p => inTrack(p) && matches(p));
  const undated = ps.filter(p => span(p)[0] == null).length;
  ps = ps.sort((a, b) => (span(a)[0] ?? 9e15) - (span(b)[0] ?? 9e15));
  if (!showUnd) ps = ps.filter(p => span(p)[0] != null);
  const toolbar = `<div class="toolbar">
      <div class="seg" role="group" aria-label="Zoom">${(() => { const near = ZOOMS.reduce((a, b) => Math.abs(b[1] - z) < Math.abs(a[1] - z) ? b : a)[1]; return ZOOMS.map(([l, v]) => `<button data-zoom="${v}" class="${v === near ? "on" : ""}">${l}</button>`).join(""); })()}</div>
      <div class="seg"><button id="expAll">Expand all</button><button id="colAll">Collapse</button></div>
      <button class="btn" id="toToday">${ico("calendar", 15)}Today</button>
      <span class="sp"></span>
      ${undated ? `<label class="switch"><input type="checkbox" id="showUnd" ${showUnd ? "checked" : ""}><span></span>Show ${undated} undated</label>` : ""}
    </div>`;
  const dated = ps.flatMap(p => p.tasks).flatMap(x => [t(x.start), t(x.end)]).filter(v => v != null);
  if (!dated.length) return toolbar + `<div class="card empty">No dated tasks here yet. Give tasks a start and end date to see them on the timeline.</div>`;
  const s0 = monday(Math.min(...dated)) - 7*DAY, e0 = Math.max(...dated) + 21*DAY;
  const weeks = Math.ceil((e0 - s0) / (7*DAY)), W = weeks * z, px = n => (n - s0) / (7*DAY) * z;
  const mcells = []; let lastM = -1, moStart = 0, wk = "";
  for (let i = 0; i < weeks; i++){
    const d = new Date(s0 + i*7*DAY);
    if (d.getUTCMonth() !== lastM){ if (lastM >= 0) mcells.push([moStart, i]); lastM = d.getUTCMonth(); moStart = i; }
    const isT = today() >= s0 + i*7*DAY && today() < s0 + (i+1)*7*DAY;
    wk += `<th class="${isT ? "tw" : ""}" style="min-width:${z}px;max-width:${z}px" ${isT ? 'title="This week"' : ""}>${z >= 18 ? d.getUTCDate() : (isT ? "•" : "")}</th>`;
  }
  mcells.push([moStart, weeks]);
  const mo = mcells.map(([a, b]) => { const d = new Date(s0 + a*7*DAY); const w = (b - a) * z; return `<th class="mo" colspan="${b - a}">${w >= 34 ? MON[d.getUTCMonth()] + (w >= 60 ? " " + d.getUTCFullYear() : "") : ""}</th>`; }).join("");
  const T = today(), tx = T >= s0 && T <= e0 ? px(T) + z / 7 / 2 : null;
  const gridBg = `background-image:repeating-linear-gradient(90deg,transparent 0 ${z - 1}px,var(--grid) ${z - 1}px ${z}px)`;
  const lane = inner => `<td class="lane" colspan="${weeks}"><div style="position:relative;width:${W}px;height:34px;${gridBg}">${inner}${tx != null ? `<div class="today" style="left:${tx}px"></div>` : ""}</div></td>`;
  let rows = "";
  for (const p of ps){
    const [a, b] = span(p), open = expanded.has(p.id) || !!query, pc = pct(p);
    const pbar = a != null ? `<div class="b p" data-open="${p.id}" ${tipAttr(p.name, [dateRange(a, b), `${Math.round(pc*100)}% · ${projStatus(p)}`])} style="left:${px(a)}px;width:${Math.max(8, px(b + DAY) - px(a))}px;background:color-mix(in srgb,${p.color} 28%,transparent)"><span class="fill" style="width:${Math.round(pc*100)}%;background:${p.color}"></span></div>` : "";
    rows += `<tr class="prj"><td class="lc"><div class="lcin"><button class="tog" data-tog="${p.id}" aria-label="${open ? "Collapse" : "Expand"}" ${p.tasks.length ? "" : "disabled"}>${p.tasks.length ? ico(open ? "chevD" : "chevR", 14, 2.2) : ""}</button>${chip(p)}<span class="lnm" data-open="${p.id}">${esc(p.name)}</span><span class="lpc">${Math.round(pc*100)}%</span></div></td>${lane(pbar)}</tr>`;
    if (open) for (const x of p.tasks){
      if (query && !matches(p, x) && !matches(p)) continue;
      const xa = t(x.start) ?? t(x.end), xb = t(x.end) ?? t(x.start);
      const tip = tipAttr((x.code ? x.code + "  " : "") + (x.title || "Untitled"), [dateRange(xa, xb), `${x.status}${x.milestone ? "" : " · " + Math.round(num(x.pct)*100) + "%"}${x.hrs !== "" && x.hrs != null && !x.milestone ? " · " + x.hrs + " h" : ""}`, overdue(x) ? "Overdue" : ""].filter(Boolean));
      let bar = "";
      if (xa != null){
        if (x.milestone) bar = `<div class="ms" data-open="${p.id}" data-tab="tasks" ${tip} style="left:${px(xb) + z/14 - 7}px;background:${x.status === "Done" ? "var(--green)" : "var(--text)"}"></div>`;
        else { const l = px(xa), w = Math.max(8, px(xb + DAY) - l);
          bar = `<div class="b ${x.status === "Done" ? "done" : ""}" data-open="${p.id}" data-tab="tasks" ${tip} style="left:${l}px;width:${w}px;background:color-mix(in srgb,${p.color} 30%,var(--panel))"><span class="fill" style="width:${Math.round(Math.min(1, num(x.pct))*100)}%;background:color-mix(in srgb,${p.color} 75%,transparent)"></span>${w > 70 ? `<span class="bl">${esc(x.title)}</span>` : ""}</div>`; }
      }
      rows += `<tr class="tk"><td class="lc"><div class="lcin" data-open="${p.id}" data-tab="tasks"><span class="sdot" style="background:${ST_COLOR[x.status]}"></span><span class="faint small">${esc(x.code)}</span><span class="tt">${esc(x.title)}</span>${overdue(x) ? `<span class="badge-over">${ico("alert", 13)}</span>` : ""}</div></td>${lane(bar)}</tr>`;
    }
  }
  return toolbar + `<div class="tl" id="tl"><table><thead><tr><th class="lc">${tx != null ? "" : ""}</th>${mo}</tr><tr><th class="lc" style="text-align:left;padding-left:12px">Project / task</th>${wk}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- board ---------- */
function vBoard(){
  const ps = active().filter(inTrack).filter(p => boardProject === "All" || p.id === boardProject);
  const cards = ps.flatMap(p => p.tasks.filter(x => matches(p, x) || matches(p)).map(x => ({p, x})));
  const cols = STATUS.filter(s => showEmptyCols || ["Not started","In progress","Done"].includes(s) || cards.some(c => c.x.status === s));
  const opts = active().filter(inTrack).map(p => `<option value="${p.id}" ${boardProject === p.id ? "selected" : ""}>${esc((p.code ? p.code + " · " : "") + p.name)}</option>`).join("");
  const LIMIT = 25;
  return `<div class="toolbar">
      <select class="inp" id="boardProject" aria-label="Project filter"><option value="All">All projects</option>${opts}</select>
      <label class="switch"><input type="checkbox" id="showEmpty" ${showEmptyCols ? "checked" : ""}><span></span>Show empty columns</label>
      <span class="sp"></span><span class="muted small">Drag cards between columns · tick to complete</span>
    </div>
    <div class="board" style="grid-template-columns:repeat(${cols.length},minmax(250px,1fr))">${cols.map(s => {
      let cs = cards.filter(c => c.x.status === s).sort((a, b) => (t(a.x.end) ?? 9e15) - (t(b.x.end) ?? 9e15));
      const total = cs.length; if (!boardMore.has(s)) cs = cs.slice(0, LIMIT);
      return `<div class="col" data-col="${s}"><div class="col-h"><span class="sdot" style="background:${ST_COLOR[s]};width:9px;height:9px"></span>${s}<span class="ct">${total}</span></div>
        ${cs.map(({p, x}) => `<div class="tcard" draggable="true" data-card="${p.id}|${x.id}" data-open="${p.id}" data-tab="tasks"><div class="row1">${ck(p, x)}<div class="tt">${x.milestone ? ico("diamond", 12) + " " : ""}${esc(x.title || "Untitled")}</div></div>
          <div class="meta">${chip(p)}<span>${esc(x.code)}</span><span class="sp"></span>${x.start || x.end ? `<span class="${overdue(x) ? "over" : ""}">${fmt(x.end || x.start)}</span>` : ""}${x.hrs && !x.milestone ? `<span>· ${esc(x.hrs)}h</span>` : ""}</div></div>`).join("")}
        ${total > LIMIT ? `<button class="btn sm more" data-more="${s}">${boardMore.has(s) ? "Show less" : `Show all ${total}`}</button>` : ""}
        ${!total ? `<div class="empty">Drop here</div>` : ""}</div>`; }).join("")}</div>`;
}

/* ---------- projects ---------- */
function vProjects(){
  let ps = active().filter(p => inTrack(p) && matches(p));
  if (!ps.length) return `<div class="card empty">No projects match. Clear the search or pick another track.</div>`;
  const sorters = {schedule: (a, b) => (span(a)[0] ?? 9e15) - (span(b)[0] ?? 9e15), name: (a, b) => a.name.localeCompare(b.name), progress: (a, b) => pct(b) - pct(a)};
  ps = ps.slice().sort(sorters[sortBy] || sorters.schedule);
  const toolbar = `<div class="toolbar"><div class="seg" role="group" aria-label="Sort">${[["schedule","Schedule"],["name","Name"],["progress","Progress"]].map(([k, l]) => `<button data-sort="${k}" class="${sortBy === k ? "on" : ""}">${l}</button>`).join("")}</div><span class="sp"></span><span class="muted small">${ps.length} projects</span></div>`;
  const card = p => {
    const [a, b] = span(p), pc = pct(p), od = p.tasks.filter(overdue).length, nx = nextTask(p);
    return `<div class="pcard" data-open="${p.id}" style="--c:${esc(p.color)}" tabindex="0">
      <div class="hd">${chip(p)}${pill(projStatus(p))}<span class="sp"></span>${ring(pc, 42, 4.5, p.color)}</div>
      <div class="nm">${esc(p.name)}</div><div class="gl" ${p.notes && p.goal ? `title="Goal: ${esc(p.goal)}"` : ""}>${esc(p.notes || p.goal) || '<span class="faint">No description yet</span>'}</div>
      ${toolChips(p)}
      ${nx ? `<div class="nx"><b>Next</b>${esc(nx.title || nx.code)}</div>` : ""}
      <div class="ft">${ico("calendar", 14)}${dateRange(a, b)}<span class="sp"></span>${work(p).length} tasks${hours(p) ? ` · ${Math.round(hours(p))}h` : ""}${od ? ` · <span class="over">${od} late</span>` : ""}</div></div>`;
  };
  if (sortBy !== "schedule") return toolbar + `<div class="pgrid">${ps.map(card).join("")}</div>`;
  const groups = TRACKS.filter(k => k !== "Portfolio").map(k => [k, ps.filter(p => p.track === k)]).filter(g => g[1].length);
  return toolbar + groups.map(([k, list]) => `<div class="group-h"><span class="tr-dot" style="background:${list[0].color};margin:0"></span>${k}<span class="ct">${list.length}</span></div><div class="pgrid">${list.map(card).join("")}</div>`).join("");
}

/* ---------- portfolio ---------- */
function vPortfolio(){
  const ps = state.projects.filter(p => isPortfolio(p) && matches(p)).sort((a, b) => (t(b.finished) ?? 0) - (t(a.finished) ?? 0));
  const shipped = ps.filter(p => projStatus(p) === "Done").length;
  return `<div class="toolbar"><button class="btn pri" id="addPf">${ico("plus", 15, 2.2)}Add shipped work</button><span class="sp"></span><span class="muted small">${shipped} shipped · ${ps.length - shipped} paused or stopped</span></div>
  <div class="pfgrid">${ps.map(p => `<div class="pf" data-open="${p.id}" tabindex="0">
      <div class="top1"><div class="nm">${esc(p.name)}</div>${pill(projStatus(p))}</div>
      <div class="sb">${[p.phase, p.event].filter(Boolean).map(esc).join(" · ") || "&nbsp;"}</div>
      <div class="nt" title="${esc(p.notes)}">${esc(p.notes)}</div>
      ${toolChips(p, 5)}
      <div class="ft">${ico("calendar", 14)}${p.finished ? fmt(p.finished) : "No date"}<span class="sp"></span>
        ${p.repo ? `<a href="${esc(p.repo)}" target="_blank" rel="noopener" data-stop>${ico("link", 13)}Repo</a>` : ""}
        ${p.writeup ? `<a href="${esc(p.writeup)}" target="_blank" rel="noopener" data-stop>${ico("link", 13)}Write-up</a>` : ""}
        ${!p.repo && !p.writeup ? `<span class="faint">Add links</span>` : ""}</div></div>`).join("") || `<div class="card empty">Nothing here yet.</div>`}</div>`;
}

/* ============ bindings ============ */
function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-stop]").forEach(a => a.addEventListener("click", e => e.stopPropagation()));
  v.onclick = e => {
    const ckb = e.target.closest("[data-ck]"); if (ckb){ e.stopPropagation(); toggleDone(ckb.dataset.ck); return; }
    const tool = e.target.closest("[data-tool]"); if (tool){ e.stopPropagation(); query = tool.dataset.tool; $("#q").value = query; if (view === "dashboard") view = "projects"; render(); toast("Showing projects using " + query); return; }
    const tg = e.target.closest("[data-tog]"); if (tg){ const id = tg.dataset.tog; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderView(); return; }
    const act = e.target.closest("[data-act]"); if (act){ ({new: newProject, open: openFile, xlsx: () => $("#xlsxInput").click()})[act.dataset.act](); return; }
    const op = e.target.closest("[data-open]"); if (op){ if (op.dataset.tab) editorTab = op.dataset.tab; else editorTab = "overview"; openEditor(op.dataset.open); }
  };
  v.onkeydown = e => { if (e.key === "Enter" && e.target.matches("[data-open][tabindex]")) openEditor(e.target.dataset.open); };
  v.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { state.settings.zoom = +b.dataset.zoom; changed(); renderView(); scrollToday(); });
  v.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => { sortBy = b.dataset.sort; renderView(); });
  if ($("#showUnd")) $("#showUnd").onchange = e => { state.settings.hideUndated = !e.target.checked; changed(); renderView(); };
  if ($("#expAll")) $("#expAll").onclick = () => { active().forEach(p => expanded.add(p.id)); renderView(); };
  if ($("#colAll")) $("#colAll").onclick = () => { expanded.clear(); renderView(); };
  if ($("#toToday")) $("#toToday").onclick = scrollToday;
  if ($("#tl") && !bindView._scrolled){ bindView._scrolled = true; scrollToday(); }
  if ($("#hmWrap")) $("#hmWrap").scrollLeft = 1e6;
  if ($("#boardProject")) $("#boardProject").onchange = e => { boardProject = e.target.value; renderView(); };
  if ($("#showEmpty")) $("#showEmpty").onchange = e => { showEmptyCols = e.target.checked; renderView(); };
  v.querySelectorAll("[data-more]").forEach(b => b.onclick = e => { e.stopPropagation(); const s = b.dataset.more; boardMore.has(s) ? boardMore.delete(s) : boardMore.add(s); renderView(); });
  if ($("#addPf")) $("#addPf").onclick = () => { const p = {id:uid(), code:"", name:"Shipped project", track:"Portfolio", color:PALETTE.Grey, statusOverride:"Done", goal:"", notes:"", event:"", phase:"", finished:iso(today()), repo:"", writeup:"", tasks:[]}; state.projects.push(p); changed(); render(); openEditor(p.id, true); };
  v.querySelectorAll(".tcard").forEach(c => {
    c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.card); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); $("#tip").classList.remove("on"); });
    c.addEventListener("dragend", () => c.classList.remove("dragging"));
  });
  v.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); });
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("drop");
      const [, x] = findTask(e.dataTransfer.getData("text/plain")); if (!x || x.status === col.dataset.col) return;
      x.status = col.dataset.col; if (x.status === "Done") x.pct = 1; if (x.status === "Not started") x.pct = 0;
      changed(); renderView(); renderNav(); toast(`${x.code || x.title} → ${x.status}`); });
  });
}
function scrollToday(){ const tl = $("#tl"); const td = tl && tl.querySelector(".today"); if (td) tl.scrollLeft = Math.max(0, parseFloat(td.style.left) - 140); }

/* ============ editor (side sheet) ============ */
let editing = null;
function openEditor(id, isNew = false){
  const p = state.projects.find(q => q.id === id); if (!p) return;
  editing = id; if (isNew) editorTab = "overview";
  let dr = $(".drawer");
  if (!dr){
    const sc = document.createElement("div"); sc.className = "dscrim"; sc.onclick = closeEditor;
    dr = document.createElement("aside"); dr.className = "drawer"; dr.setAttribute("role", "dialog"); dr.setAttribute("aria-modal", "true");
    document.body.append(sc, dr);
    requestAnimationFrame(() => { sc.classList.add("on"); dr.classList.add("on"); });
  }
  drawEditor(p, isNew);
}
function closeEditor(){
  const dr = $(".drawer"), sc = $(".dscrim"); if (!dr) return;
  dr.classList.remove("on"); sc && sc.classList.remove("on");
  setTimeout(() => { dr.remove(); sc && sc.remove(); }, 220);
  editing = null; render();
}
function drawEditor(p, focusName = false){
  const dr = $(".drawer"); if (!dr) return;
  const keepScroll = dr.querySelector(".dr-body")?.scrollTop || 0;
  const [a, b] = span(p), pf = isPortfolio(p);
  const opts = (list, v) => list.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("");
  const fld = (label, inner) => `<label class="fld"><span>${label}</span>${inner}</label>`;
  const input = (f, ph = "", type = "text") => `<input type="${type}" data-f="${f}" value="${esc(p[f])}" placeholder="${esc(ph)}">`;
  const link = f => `<div class="lnk">${input(f, "https://…")}${p[f] ? `<a href="${esc(p[f])}" target="_blank" rel="noopener" title="Open">${ico("link", 16)}</a>` : ""}</div>`;
  const overview = `
    <div class="grp-h">Details</div><div class="grp">
      ${fld("Code", input("code", "e.g. L11"))}
      ${fld("Track", `<select data-f="track">${opts(TRACKS, p.track)}</select>`)}
      ${fld("Status", `<select data-f="statusOverride"><option value="" ${!p.statusOverride ? "selected" : ""}>Automatic (from tasks)</option>${opts(STATUS, p.statusOverride)}</select>`)}
      <div class="fld"><span>Colour</span><div class="swatches">${Object.entries(PALETTE).map(([n, h]) => `<button class="sw ${h.toLowerCase() === String(p.color).toLowerCase() ? "on" : ""}" title="${n}" aria-label="${n}" data-sw="${h}" style="background:${h}"></button>`).join("")}</div></div>
    </div>
    <div class="grp-h">About</div><div class="grp">
      ${fld("Goal", input("goal", "One line: what does done look like?"))}
      ${fld("Description", `<textarea data-f="notes" placeholder="What it is, how it works, what it achieves…">${esc(p.notes)}</textarea>`)}
      ${fld("Tools", `<input data-tools value="${esc((p.tools || []).join(", "))}" placeholder="Comma-separated, e.g. Python, FastAPI, Ollama">`)}
    </div>
    <div class="grp-h">${pf ? "Portfolio" : "Shipping & links"}</div><div class="grp">
      ${fld("Phase / scope", input("phase", "e.g. Phase 1"))}
      ${fld("Event / context", input("event", "e.g. hackathon name"))}
      ${fld("Finished", input("finished", "", "date"))}
      ${fld("Repo", link("repo"))}
      ${fld("Write-up / demo", link("writeup"))}
    </div>
    <div style="margin-top:22px;display:flex"><button class="btn danger" id="eDelete">${ico("trash", 15)}Delete project</button></div>`;
  const tasks = `
    <div class="tasks-bar"><button class="btn pri sm" id="eAdd">${ico("plus", 14, 2.2)}Task</button><button class="btn sm" id="eAddM">${ico("diamond", 14)}Milestone</button>
      <button class="btn sm" id="eChain" title="Each task starts the day after the previous one ends, keeping its own length">${ico("chain", 14)}Chain dates</button>
      <span class="sp"></span><span class="muted small">${work(p).filter(x => x.status === "Done").length}/${work(p).length} done</span></div>
    ${p.tasks.length ? `<div style="overflow-x:auto"><table class="ttbl"><thead><tr><th style="width:34px"></th><th style="width:60px">ID</th><th style="min-width:240px">Task</th><th style="width:136px">Start</th><th style="width:136px">End</th><th style="width:60px">Hours</th><th style="width:122px">Status</th><th style="width:56px">%</th><th style="width:30px" title="Milestone">${ico("diamond", 13)}</th><th style="width:96px"></th></tr></thead><tbody>
    ${p.tasks.map((x, i) => `<tr data-ti="${i}" class="${x.milestone ? "ms-row" : ""}">
      <td>${ck(p, x)}</td>
      <td><input data-tf="code" value="${esc(x.code)}" aria-label="ID"></td>
      <td><input data-tf="title" value="${esc(x.title)}" placeholder="${x.milestone ? "Milestone" : "Task"}" aria-label="Title"></td>
      <td><input type="date" data-tf="start" value="${esc(x.start)}" aria-label="Start"></td>
      <td><input type="date" data-tf="end" value="${esc(x.end)}" aria-label="End" style="${overdue(x) ? "color:var(--red);font-weight:600" : ""}"></td>
      <td><input type="number" min="0" step="0.5" data-tf="hrs" value="${esc(x.hrs)}" aria-label="Hours" ${x.milestone ? "disabled" : ""}></td>
      <td><select data-tf="status" aria-label="Status">${opts(STATUS, x.status)}</select></td>
      <td><input type="number" min="0" max="100" step="5" data-tf="pct" value="${Math.round(num(x.pct)*100)}" aria-label="Percent done"></td>
      <td><button class="msbtn ${x.milestone ? "on" : ""}" data-ms="${i}" title="Milestone" aria-pressed="${x.milestone}">${ico("diamond", 15)}</button></td>
      <td class="acts"><button class="ia" data-up="${i}" title="Move up">${ico("chevU", 14)}</button><button class="ia" data-dn="${i}" title="Move down">${ico("chevD", 14)}</button><button class="ia" data-dup="${i}" title="Duplicate">${ico("copy", 14)}</button><button class="ia del" data-del="${i}" title="Delete">${ico("trash", 14)}</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="card empty">No tasks yet. Add one, or set a Status in Overview for work without tasks.</div>`}`;
  dr.innerHTML = `
    <div class="dr-head">${chip(p)}<input class="dr-title" data-f="name" value="${esc(p.name)}" aria-label="Project name" id="eName"><button class="icon-btn" id="eClose" aria-label="Close" title="Close (Esc)">${ico("close", 18)}</button></div>
    <div class="dr-sub">${pill(projStatus(p))}<span>${ico("calendar", 13)}</span><span style="margin-left:-6px">${dateRange(a, b)}</span><span>·</span><span>${work(p).length} tasks</span>${hours(p) ? `<span>·</span><span>${Math.round(hours(p))} h</span>` : ""}<span>·</span><span>${Math.round(pct(p)*100)}% complete</span></div>
    ${(p.tools || []).length ? `<div style="padding:0 26px 12px">${toolChips(p, 99)}</div>` : ""}<div class="dr-tabs"><div class="seg" role="tablist"><button role="tab" data-etab="overview" class="${editorTab === "overview" ? "on" : ""}">Overview</button><button role="tab" data-etab="tasks" class="${editorTab === "tasks" ? "on" : ""}">Tasks <span class="faint">${p.tasks.length}</span></button></div></div>
    <div class="dr-body">${editorTab === "tasks" ? tasks : overview}</div>`;
  dr.querySelector(".dr-body").scrollTop = keepScroll;
  const P = () => state.projects.find(q => q.id === editing);
  dr.querySelectorAll("[data-etab]").forEach(b => b.onclick = () => { editorTab = b.dataset.etab; drawEditor(P()); });
  dr.querySelectorAll("[data-f]").forEach(el => el.addEventListener("change", () => { P()[el.dataset.f] = el.value; changed(); drawEditor(P()); renderView(); renderNav(); }));
  dr.querySelectorAll("[data-tools]").forEach(el => el.addEventListener("change", () => { const seen = new Set(); P().tools = el.value.split(",").map(s => s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase())); changed(); drawEditor(P()); renderView(); }));
  dr.querySelectorAll("[data-sw]").forEach(el => el.onclick = () => { P().color = el.dataset.sw; changed(); drawEditor(P()); renderView(); });
  dr.querySelectorAll("[data-ck]").forEach(el => el.onclick = () => toggleDone(el.dataset.ck));
  dr.querySelectorAll("[data-tool]").forEach(el => el.onclick = () => { query = el.dataset.tool; closeEditor(); $("#q").value = query; view = "projects"; render(); });
  dr.querySelectorAll("[data-tf]").forEach(el => el.addEventListener("change", () => {
    const x = P().tasks[+el.closest("tr").dataset.ti]; const f = el.dataset.tf;
    if (f === "pct"){ x.pct = Math.max(0, Math.min(100, num(el.value))) / 100; if (x.pct >= 1) x.status = "Done"; else if (x.pct > 0 && x.status === "Not started") x.status = "In progress"; }
    else if (f === "status"){ x.status = el.value; if (x.status === "Done") x.pct = 1; }
    else if (f === "hrs") x.hrs = el.value === "" ? "" : num(el.value);
    else { x[f] = el.value; if (f === "start" && x.end && x.start > x.end) x.end = x.start; if (f === "end" && x.start && x.end < x.start) x.start = x.end; }
    changed(); drawEditor(P()); renderView();
  }));
  const mut = fn => { fn(P().tasks); changed(); drawEditor(P()); renderView(); };
  dr.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => mut(ts => { const x = ts[+b.dataset.ms]; x.milestone = !x.milestone; if (x.milestone){ x.hrs = ""; if (x.end) x.start = x.end; } }));
  dr.querySelectorAll("[data-del]").forEach(b => b.onclick = () => mut(ts => ts.splice(+b.dataset.del, 1)));
  dr.querySelectorAll("[data-dup]").forEach(b => b.onclick = () => mut(ts => ts.splice(+b.dataset.dup + 1, 0, {...ts[+b.dataset.dup], id: uid(), status: "Not started", pct: 0})));
  dr.querySelectorAll("[data-up]").forEach(b => b.onclick = () => mut(ts => { const i = +b.dataset.up; if (i > 0) [ts[i-1], ts[i]] = [ts[i], ts[i-1]]; }));
  dr.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => mut(ts => { const i = +b.dataset.dn; if (i < ts.length - 1) [ts[i+1], ts[i]] = [ts[i], ts[i+1]]; }));
  const nextStart = ts => { const ends = ts.map(x => t(x.end)).filter(v => v != null); return ends.length ? Math.max(...ends) + DAY : today(); };
  const nextCode = (ts, m) => { const base = P().code || "T"; return m ? "M" + base : `${base}.${ts.filter(x => !x.milestone).length + 1}`; };
  const focusLast = () => { const rows = dr.querySelectorAll(".ttbl tbody tr"); const inp = rows[rows.length - 1]?.querySelector('[data-tf="title"]'); if (inp){ inp.focus(); inp.scrollIntoView({block:"nearest"}); } };
  if (dr.querySelector("#eAdd")) dr.querySelector("#eAdd").onclick = () => { mut(ts => { const s = nextStart(ts); ts.push({id:uid(), code: nextCode(ts, false), title:"", deliverable:"", start: iso(s), end: iso(s + 6*DAY), hrs: 11, status:"Not started", pct:0, milestone:false}); }); focusLast(); };
  if (dr.querySelector("#eAddM")) dr.querySelector("#eAddM").onclick = () => { mut(ts => { const s = nextStart(ts) - DAY; ts.push({id:uid(), code: nextCode(ts, true), title:"", deliverable:"", start: iso(s), end: iso(s), hrs:"", status:"Not started", pct:0, milestone:true}); }); focusLast(); };
  if (dr.querySelector("#eChain")) dr.querySelector("#eChain").onclick = () => mut(ts => { let prev = null; for (const x of ts){ const a = t(x.start), b = t(x.end); const len = a != null && b != null ? b - a : (x.milestone ? 0 : 6*DAY);

function sheetXml(rows, {cols = [], freeze = null, filter = null, heights = {}} = {}){

    r.forEach((c, ci) => { if (!c) return; const ref = colName(ci) + (ri + 1); const sa = c.s ? ` s="${c.s}"` : "";
      if (c.v == null || c.v === "") { if (c.s) cells += `<c r="${ref}"${sa}/>`; }
      else if (typeof c.v === "number") cells += `<c r="${ref}"${sa}><v>${c.v}</v></c>`;
      else cells += `<c r="${ref}"${sa} t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`; });
    body += `<row r="${ri + 1}"${heights[ri] ? ` ht="${heights[ri]}" customHeight="1"` : ""}>${cells}</row>`; });
  const pane = freeze ? `<pane xSplit="${freeze[0]}" ySplit="${freeze[1]}" topLeftCell="${colName(freeze[0])}${freeze[1] + 1}" activePane="bottomRight" state="frozen"/><selection pane="bottomRight"/>` : "";

<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" zoomScale="90">${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>
${cols.length ? `<cols>${cols.map((w, i) => w ? `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>` : "").join("")}</cols>` : ""}<sheetData>${body}</sheetData>${filter ? `<autoFilter ref="${filter}"/>` : ""}<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}
function buildXlsx(){
  const S = styleBook(), T = today();

    wkHead: S.get({b:1, c:"FFFFFF", fill:"1D1D1F", nf:165, al:"center", rot:90}), wkToday: S.get({b:1, c:"FFFFFF", fill:"FF3B30", nf:165, al:"center", rot:90}),
    month: S.get({b:1, sz:8}), cell: S.get({border:1}), cellC: S.get({border:1, al:"center"}), wrap: S.get({border:1, wrap:1}),

    pB: S.get({b:1, border:1, fill:"F2F2F7"}), pBC: S.get({b:1, border:1, fill:"F2F2F7", al:"center"}), pDate: S.get({b:1, border:1, fill:"F2F2F7", nf:164, al:"center"}), pPct: S.get({b:1, border:1, fill:"F2F2F7", nf:9, al:"center"}),
    ms: S.get({fill:"1D1D1F"}), done: S.get({fill:"C7C7CC"}), grid: S.get({border:1}), it: S.get({border:1, i:1, b:1})

  const stFill = {"Done":"D4F4DC","In progress":"CCE4FF","Blocked":"FFD8D6","On hold":"FFE9CC","Dropped":"E5E5EA"};
  const stS = s => stFill[s] ? S.get({border:1, al:"center", fill: stFill[s]}) : st.cellC;
  const palName = c => Object.keys(PALETTE).find(k => PALETTE[k].toLowerCase() === String(c).toLowerCase()) || hex6(c);
  const A = active(), P = state.projects.filter(isPortfolio);

  g[1] = [{v:`Exported ${fmt(T)} from Project Desk. Re-import with Import Excel… (Merge or Replace). Bars are a snapshot: re-export after changes.`, s:st.muted}];
  const hdr = ["ID","Proj","Track","Type","Task / Project name","Deliverable / Goal","Start","End","Days","Est. hrs","Status","% Done","Color"];
  g[4] = []; g[5] = hdr.map(h => ({v:h, s:st.head})); g[5][13] = {v:"", s:st.head};

  let r = 6;
  for (const p of A){
    const [a, b] = span(p), h = hex6(p.color), dark = S.get({fill:h}), light = S.get({fill:tintHex(h)}), codeS = S.get({b:1, c:"FFFFFF", fill:h, al:"center", border:1});
    const row = g[r] = [{v:p.code, s:codeS},{v:p.code, s:codeS},{v:p.track, s:st.pBC},{v:"Project", s:st.pBC},{v:p.name, s:st.pB},{v:p.goal, s:st.pB},
      {v: a != null ? a/DAY + 25569 : "", s:st.pDate},{v: b != null ? b/DAY + 25569 : "", s:st.pDate},{v: a != null ? Math.round((b - a)/DAY) + 1 : "", s:st.pBC},
      {v: hours(p) || "", s:st.pBC},{v: projStatus(p), s:st.pBC},{v: pct(p), s:st.pPct},{v: palName(p.color), s:st.pBC}];
    barCells(row, a, b, dark); r++;
    for (const x of p.tasks){

        {v: serial(x.start) ?? "", s:st.date},{v: serial(x.end) ?? "", s: overdue(x) ? st.dateRed : st.date},{v: xa != null ? Math.round((xb - xa)/DAY) + 1 : "", s:st.cellC},

  A.forEach((p, i) => { const [a, b] = span(p), h = hex6(p.color);

      {v: hours(p) || "", s:st.cellC},{v: pct(p), s:st.pctS},{v: projStatus(p), s:stS(projStatus(p))},{v: work(p).length, s:st.cellC},{v: p.tasks.filter(overdue).length || "", s:st.cellC},{v:p.goal, s:st.wrap},{v:p.notes, s:st.wrap},{v:(p.tools || []).join(", "), s:st.wrap}]; });

  // ---- Portfolio sheet (same layout the importer reads)

  P.forEach((p, i) => { const ps = projStatus(p);
    pf[4 + i] = [{v:i + 1, s:st.cellC},{v:p.name, s:S.get({b:1, border:1})},{v:p.phase, s:st.cell},{v:p.event, s:st.wrap},{v:ps, s:stS(ps)},{v: serial(p.finished) ?? "", s:st.date},{v:p.repo, s:st.cell},{v:p.writeup, s:st.cell},{v:p.notes, s:st.wrap},{v:(p.tools || []).join(", "), s:st.wrap}]; });

    ["Portfolio", sheetXml(pf, {cols: [5,34,16,30,12,14,32,32,70,40], freeze: [2, 4], filter: `A4:J${Math.max(5, 4 + P.length)}`})]

    {name:"docProps/core.xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Project Desk export</dc:title><dc:creator>Project Desk</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`},

function exportXlsx(){
  try {
    const blob = buildXlsx();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `project-desk-${iso(today())}.xlsx`; a.click();

}

/* ============ boot ============ */
(async function boot(){
  const local = loadLocal();
  if (local && local.state){ try { state = normalize(local.state); dirty = !!local.dirty; fileName = local.fileName || ""; } catch(e){ state = null; } }
  if (!state){ state = normalize(JSON.parse($("#seed").textContent)); dirty = false; }
  bump(1); cacheLocal();   // record today's visit (saved with the next save)
  if (fsa){
    const h = await idbGet("handle");
    if (h){
      pendingHandle = h;
      try { if (await h.queryPermission({mode:"readwrite"}) === "granted"){ await reconnect(); } } catch(e){}
      if (pendingHandle) showBanner(`Reconnect to <b>${esc(h.name)}</b> to keep it in sync.`, [["Reconnect", reconnect], ["Not now", hideBanner]]);
    }
  }
  renderShell(); render();
  window.addEventListener("beforeunload", e => { if (dirty && !(fileHandle && autosave)) { e.preventDefault(); e.returnValue = ""; } });
})();
