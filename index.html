<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Project Desk</title>
<script>(function(){try{var v=localStorage.getItem("project-desk-theme");if(v==="light"||v==="dark")document.documentElement.dataset.theme=v;}catch(e){}})();</script>
<style>
:root{
  --bg:#F2F2F7; --side:rgba(246,246,249,.86); --panel:#FFFFFF; --panel2:#F7F7FA; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --line:rgba(60,60,67,.12); --line2:rgba(60,60,67,.22); --grid:rgba(60,60,67,.07);
  --text:#1D1D1F; --text2:#3C3C43; --muted:#6E6E73; --faint:#8E8E93;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --indigo:#5856D6;
  --sh1:0 1px 2px rgba(0,0,0,.05); --sh2:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06); --sh3:0 18px 50px rgba(0,0,0,.22);
  --r:16px; --r2:12px; --r3:9px; --h0:#EBEDF0;--h1:#9BE9A8;--h2:#40C463;--h3:#30A14E;--h4:#216E39;color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000000; --side:rgba(28,28,30,.86); --panel:#1C1C1E; --panel2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --line:rgba(84,84,88,.55); --line2:rgba(84,84,88,.8); --grid:rgba(255,255,255,.05);
    --text:#F5F5F7; --text2:#E5E5EA; --muted:#A1A1A6; --faint:#8E8E93;
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6;
    --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); --sh3:0 18px 50px rgba(0,0,0,.6); --h0:#1E242C;--h1:#0E4429;--h2:#006D32;--h3:#26A641;--h4:#39D353;color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000000; --side:rgba(28,28,30,.86); --panel:#1C1C1E; --panel2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --line:rgba(84,84,88,.55); --line2:rgba(84,84,88,.8); --grid:rgba(255,255,255,.05);
    --text:#F5F5F7; --text2:#E5E5EA; --muted:#A1A1A6; --faint:#8E8E93;
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --indigo:#5E5CE6;
    --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45); --sh3:0 18px 50px rgba(0,0,0,.6); --h0:#1E242C;--h1:#0E4429;--h2:#006D32;--h3:#26A641;--h4:#39D353;color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px;border-radius:8px}
.i{flex:none;display:block}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:12px} .faint{color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(10,132,255,.35)}
.brand .nm{font-weight:700;font-size:15px;line-height:1.2;cursor:text;border-radius:6px;padding:1px 4px;margin-left:-4px}
.brand .nm:hover{background:var(--fill2)}
.brand input{font-weight:700;font-size:15px;border:1px solid var(--blue);border-radius:6px;padding:1px 4px;width:150px;background:var(--panel);outline:none}
.brand .sub{font-size:11.5px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--text);font-weight:500}
.nav:hover{background:var(--fill2)}
.nav.on{background:var(--fill);font-weight:600}
.nav.on .i{color:var(--blue)}
.nav .i{color:var(--muted)}
.nav .ct{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:500}
.side-h{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:18px 10px 6px}
.tr-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin:0 5px}
.sync{margin-top:auto;padding-top:12px}
.sync-card{background:var(--panel);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--sh1);border:1px solid var(--line)}
.sync-row{display:flex;gap:9px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;background:var(--faint)}
.dot.ok{background:var(--green)} .dot.warn{background:var(--orange)} .dot.busy{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.sync-t{font-weight:600;font-size:13px;word-break:break-all}
.sync-s{font-size:12px;color:var(--muted)}
.sync .btn{width:100%;justify-content:center;margin-top:9px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:18px 28px 14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;z-index:5}
.top h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.022em}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:10px;padding:0 8px 0 10px;height:34px;width:250px;color:var(--muted);transition:background .15s}
.search:focus-within{background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 30%,transparent)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text)}
kbd{font:600 11px var(--font);color:var(--faint);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 5px;cursor:pointer;white-space:nowrap}
.view{flex:1;overflow:auto;padding:4px 28px 32px;scroll-padding-top:20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--text);transition:filter .12s,background .12s}
.btn:hover{background:var(--fill2);filter:brightness(.98)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08);background:var(--blue)}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--fill2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn .badge{width:7px;height:7px;border-radius:50%;background:var(--orange)}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--fill2);color:var(--text)}
.banner{margin:0 28px 12px;padding:10px 14px;border-radius:var(--r2);background:color-mix(in srgb,var(--orange) 14%,var(--panel));display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--orange) 30%,transparent)}
.banner .sp{flex:1}
.tabbar{display:none}

/* ---------- common ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh2);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.card-h h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-h .ct{color:var(--faint);font-size:13px;font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:20px;padding:0 6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--fill2);color:var(--text2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Not{color:var(--muted)} .st-In{color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.st-Done{color:#1E9E44;background:color-mix(in srgb,var(--green) 15%,transparent)} .st-Blocked{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.st-On{color:#C77700;background:color-mix(in srgb,var(--orange) 15%,transparent)} .st-Dropped{color:var(--faint)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-Done{color:var(--green)}:root:not([data-theme="light"]) .st-On{color:var(--orange)}}
:root[data-theme="dark"] .st-Done{color:var(--green)}:root[data-theme="dark"] .st-On{color:var(--orange)}
.bar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.ring{display:block}
.ringwrap{position:relative;flex:none}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--faint);padding:14px 0;text-align:center;font-size:13px}
.over{color:var(--red);font-weight:600}
.badge-over{display:inline-flex;align-items:center;gap:4px;color:var(--red);font-size:12px;font-weight:600}
.list .item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.list .item:last-child{border-bottom:0}
.list .item:hover .t{color:var(--blue)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line2);background:none;display:grid;place-items:center;color:transparent;flex:none;padding:0;transition:all .15s}
.ck:hover{border-color:var(--blue)}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 16px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text)}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}
:root[data-theme="dark"] .seg button.on{background:#636366}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch span{width:38px;height:23px;border-radius:99px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(15px)}
select.inp{background:var(--fill);border:0;border-radius:9px;padding:6px 10px;font-weight:500}

/* ---------- dashboard ---------- */
.stats{grid-template-columns:2fr repeat(4,minmax(0,1fr))}
.hero{display:flex;align-items:center;gap:20px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash2{grid-template-columns:1.25fr 1fr}
.dash3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hbar{display:grid;grid-template-columns:76px 1fr 70px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hbar .track{position:relative;height:10px;background:var(--fill);border-radius:99px;overflow:hidden}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hbar .n{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--fill);gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
@media (max-width:1280px){.stats{grid-template-columns:repeat(4,1fr)}.stats .hero-card{grid-column:1/-1}.dash3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.dash2,.dash3{grid-template-columns:1fr}}

/* ---------- timeline ---------- */
.tl{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh2);overflow:auto;position:relative;max-height:calc(100dvh - 190px)}
.tl table{border-collapse:separate;border-spacing:0}
.tl td,.tl th{padding:0;height:34px;border-bottom:1px solid var(--line)}
.tl .lc{position:sticky;left:0;background:var(--panel);z-index:3;min-width:310px;max-width:310px;border-right:1px solid var(--line);padding:0 10px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.tl thead th{position:sticky;top:0;background:var(--panel);z-index:4;font-size:11px;color:var(--muted);font-weight:600;height:26px}
.tl thead tr:nth-child(2) th{top:26px;height:24px;font-weight:500;color:var(--faint)}
.tl thead th.lc{z-index:6}
.tl .mo{text-align:left;padding-left:6px;border-left:1px solid var(--line);color:var(--text2)}
.tl tr.prj td{background:var(--panel2)}
.tl tr.prj td.lc{background:var(--panel2)}
.tl .lcin{display:flex;align-items:center;gap:7px;min-width:0}
.tl .lnm{font-weight:600;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl .lnm:hover{color:var(--blue)}
.tl .lpc{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.tl .tog{border:0;background:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint);padding:0;flex:none}
.tl .tog:hover{background:var(--fill)}
.tl .tk .lcin{padding-left:30px;cursor:pointer}
.tl .tk .lcin:hover .tt{color:var(--blue)}
.tl .tk .tt{overflow:hidden;text-overflow:ellipsis}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.tl .lane{position:relative}
.tl .b{position:absolute;top:8px;height:18px;border-radius:6px;cursor:pointer;overflow:hidden;display:flex;align-items:center;transition:filter .12s}
.tl .b:hover{filter:brightness(.95)}
.tl .b .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px}
.tl .b .bl{position:relative;font-size:11px;font-weight:600;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);opacity:.85}
.tl .b.p{top:11px;height:12px;border-radius:99px}
.tl .b.p .fill{border-radius:99px}
.tl .b.done{opacity:.45}
.tl .ms{position:absolute;top:10px;width:14px;height:14px;transform:rotate(45deg);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--panel)}
.tl .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2;pointer-events:none;opacity:.85}
.tl thead th.tw{color:#fff;background:var(--red);border-radius:6px;font-weight:700}
.tl .tlab{position:absolute;top:3px;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;z-index:7;pointer-events:none}
.tip{position:fixed;z-index:100;pointer-events:none;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--sh3);border-radius:10px;padding:8px 11px;font-size:12px;max-width:300px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:2px}

/* ---------- board ---------- */
.board{display:grid;gap:14px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:var(--fill2);border-radius:var(--r);padding:10px;min-height:160px;transition:background .15s}
.col.drop{background:color-mix(in srgb,var(--blue) 12%,transparent);outline:2px dashed var(--blue);outline-offset:-3px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;font-weight:600;font-size:14px}
.col-h .ct{color:var(--faint);font-weight:500}
.tcard{background:var(--panel);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh1),0 0 0 .5px var(--line);cursor:grab;position:relative;transition:transform .12s, box-shadow .12s}
.tcard:hover{box-shadow:var(--sh2),0 0 0 .5px var(--line)}
.tcard.dragging{opacity:.5}
.tcard .row1{display:flex;gap:9px;align-items:flex-start}
.tcard .tt .i{display:inline-block;vertical-align:-1px;margin-right:3px;color:var(--muted)}
.tcard .tt{font-weight:600;font-size:13px;line-height:1.35;flex:1;min-width:0}
.tcard .meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--muted);padding-left:29px}
.tcard .meta .sp{flex:1}
.more{width:100%;justify-content:center;margin-top:2px}

/* ---------- projects ---------- */
.group-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:8px 2px 12px}
.group-h .ct{color:var(--faint);font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:28px}
.pcard{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh2);padding:16px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh3)}
.pcard .hd{display:flex;align-items:center;gap:8px}
.pcard .nm{font-weight:700;font-size:16px;line-height:1.25;letter-spacing:-.015em}
.pcard .gl{color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:18px}
.pcard .nx{font-size:12.5px;color:var(--text2);background:var(--fill2);border-radius:8px;padding:6px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nx b{color:var(--muted);font-weight:600;margin-right:4px}
.pcard .ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}

/* ---------- portfolio ---------- */
.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pf{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh2);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.pf:hover{transform:translateY(-2px);box-shadow:var(--sh3)}
.pf .top1{display:flex;align-items:flex-start;gap:8px}
.pf .nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em;flex:1}
.pf .sb{font-size:12.5px;color:var(--muted)}
.pf .nt{font-size:13px;color:var(--text2);flex:1;line-height:1.45;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pf .ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.pf .ft a{color:var(--blue);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.pf .ft a:hover{text-decoration:underline}

/* ---------- drawer (editor) ---------- */
.dscrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:40;opacity:0;transition:opacity .2s}
.dscrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1060px,100vw);background:var(--bg);box-shadow:var(--sh3);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.dr-title{flex:1;min-width:0;font-size:22px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;background:none;border-radius:8px;padding:2px 6px;outline:none}
.dr-title:hover{background:var(--fill2)} .dr-title:focus{border-color:var(--blue);background:var(--panel)}
.dr-sub{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:0 26px 12px;font-size:12.5px;color:var(--muted)}
.dr-tabs{padding:0 20px 12px}
.dr-body{flex:1;overflow:auto;padding:0 20px 28px}
.grp-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin:18px 14px 6px}
.grp{background:var(--panel);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh1)}
.fld{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:44px}
.fld:last-child{border-bottom:0}
.fld>span{font-size:13.5px;color:var(--text)}
.fld input,.fld select,.fld textarea{border:0;background:none;outline:none;font-size:14px;width:100%;color:var(--text);padding:4px 0}
.fld textarea{resize:vertical;min-height:120px;line-height:1.5}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint)}
.fld .lnk{display:flex;gap:6px;align-items:center}
.fld .lnk a{color:var(--blue);display:grid;place-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text)}
.tasks-bar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
.ttbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh1)}
.ttbl th{text-align:left;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:9px 6px;border-bottom:1px solid var(--line);background:var(--panel)}
.ttbl td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.ttbl tr:last-child td{border-bottom:0}
.ttbl tr.ms-row td{background:var(--fill2)}
.ttbl input,.ttbl select{width:100%;background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 6px;color:var(--text);outline:none;font-size:13px}
.ttbl input:hover,.ttbl select:hover{background:var(--fill2)}
.ttbl input:focus,.ttbl select:focus{border-color:var(--blue);background:var(--panel)}
.ttbl input[type=date]{font-variant-numeric:tabular-nums}
.ttbl .acts{white-space:nowrap;opacity:.25;transition:opacity .12s}
.ttbl tr:hover .acts,.ttbl tr:focus-within .acts{opacity:1}
.ttbl .ia{border:0;background:none;padding:4px;border-radius:6px;color:var(--muted)}
.ttbl .ia:hover{background:var(--fill);color:var(--text)}
.ttbl .ia.del:hover{color:var(--red)}
.ttbl .msbtn{border:0;background:none;padding:4px;border-radius:6px;color:var(--line2)}
.ttbl .msbtn.on{color:var(--text)}

/* ---------- menus / palette / modals ---------- */
.menu{position:fixed;z-index:60;min-width:250px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh3);padding:6px;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}
.menu .mh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;gap:9px}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13.5px;text-align:left;color:var(--text)}
.mi:hover,.mi.sel{background:var(--blue);color:#fff}
.mi:hover .i,.mi.sel .i,.mi:hover kbd,.mi.sel kbd{color:#fff}
.mi .i{color:var(--muted)}
.mi kbd{margin-left:auto;background:none;border:0;padding:0}
.menu .sep{height:1px;background:var(--line);margin:5px 6px}
.menu .mrow{display:flex;align-items:center;padding:7px 10px;font-size:13.5px}
.pal-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.2);display:flex;justify-content:center;padding-top:12vh}
.pal{width:min(620px,92vw);max-height:62vh;display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh3);overflow:hidden;animation:pop .12s ease-out}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-in input{flex:1;border:0;background:none;outline:none;font-size:18px;color:var(--text)}
.pal-list{overflow:auto;padding:6px}
.pal-g{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
.pal .mi .sub{color:var(--muted);font-size:12px;margin-left:auto;padding-left:10px;white-space:nowrap;flex:none}
.pal .mi.sel .sub{color:rgba(255,255,255,.8)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:80;overflow:auto}
.sheet{background:var(--panel);border-radius:18px;box-shadow:var(--sh3);width:min(1100px,100%);padding:22px 24px;animation:pop .15s ease-out}
.sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.015em}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.imp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.imp-stats div{background:var(--fill2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.imp-stats b{display:block;font-size:22px;color:var(--text)}
.imp-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:2px 12px;font-size:13px}
.imp-list .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.imp-list .row:last-child{border-bottom:0}
.imp-list .grow{flex:1;min-width:0} .imp-list .t{font-weight:600} .imp-list .m{color:var(--muted);font-size:12px}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.tag.new{background:color-mix(in srgb,var(--green) 18%,transparent);color:#1E9E44}.tag.upd{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}.tag.same{background:var(--fill);color:var(--muted)}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,10px);background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:99;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--sh3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.welcome{max-width:560px;margin:8vh auto;text-align:center}
.welcome .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff}
.welcome h2{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 22px}
.welcome .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- polish ---------- */
.view>*{animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.mi .chk{margin-left:auto;color:var(--blue)} .mi:hover .chk,.mi.sel .chk{color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tool{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--fill2);color:var(--text2);border:0;line-height:1.5;white-space:nowrap}
button.tool:hover{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.tool.tmore{color:var(--muted);cursor:default}
.fld .tools{padding:4px 0}
/* ---------- activity heatmap ---------- */
.dash-act{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-columns:28px auto;gap:4px 6px;width:max-content}
.hm-months{display:grid;grid-auto-flow:column;grid-auto-columns:11px;gap:3px;padding-left:1.5px;font-size:10.5px;color:var(--muted);height:14px;grid-column:2}
.hm-months span{white-space:nowrap;overflow:visible}
.hm-days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:10px;color:var(--muted);line-height:11px}
.hm-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;padding-left:1.5px}
.hm-grid i{width:11px;height:11px;border-radius:3px;background:var(--h0);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.04)}
.hm-grid i.l1{background:var(--h1)}.hm-grid i.l2{background:var(--h2)}.hm-grid i.l3{background:var(--h3)}.hm-grid i.l4{background:var(--h4)}
.hm-grid i.fut{background:transparent;box-shadow:none}
.hm-grid i.tdy{outline:1.5px solid var(--text);outline-offset:1px}
.hm-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.hm-legend{display:flex;align-items:center;gap:3px;margin-left:auto}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.hm-stats div{background:var(--fill2);border-radius:10px;padding:8px 12px}
.hm-stats b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hm-stats span{font-size:12px;color:var(--muted)}
.tot-big{display:flex;align-items:baseline;gap:8px}
.tot-big b{font-size:40px;letter-spacing:-.03em;line-height:1}
.tot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px;font-size:13px}
.tot-grid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.tot-grid div span{color:var(--muted)} .tot-grid div b{font-variant-numeric:tabular-nums}
@media (max-width:1100px){.dash-act{grid-template-columns:1fr}.hm-stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:14px 16px 10px;flex-wrap:wrap}
  .top h1{font-size:24px}
  .search{order:5;width:100%}
  .view{padding:4px 16px 96px}
  .banner{margin:0 16px 12px}
  .stats{grid-template-columns:1fr 1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--faint);padding:4px 0}
  .tabbar button.on{color:var(--blue)}
  .tl .lc{min-width:190px;max-width:190px}
  .fld{grid-template-columns:110px 1fr}
  .drawer{width:100vw}
  .newlbl{display:none}
  #fileBtn>span:not(.badge){display:none}
  .top .ttl{flex:1;min-width:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

A standalone replay viewer shows an interactive timeline, diffs and an integrity check, and can export a self-contained offline HTML replay. Built for the OpenAI Codex hackathon; next steps include a Gemini CLI adapter, secret redaction and signing.", "event": "OpenAI Codex hackathon", "phase": "Phase 1", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["Node.js", "JavaScript", "pnpm", "SHA-256", "Codex CLI", "Claude Code", "Vercel"]}, {"id": "2794945964", "code": "", "name": "Factory Guardian", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "Project built for Google Cloud's Agentic Cinema (Blockbuster) hackathon on Devpost, using Gemini on Google Cloud. Phase 1 was submitted.", "event": "Gemini Agentic Cinema hackathon", "phase": "Phase 1", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["Gemini", "Google Cloud"]}, {"id": "b1f18b0acb", "code": "", "name": "Cache-Aside System", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A distributed cache-aside service: reads check Redis first and fall back to PostgreSQL, while writes update the database and invalidate the cache atomically so stale data isn't served. Load tests with k6 measure hit rates and latency under traffic. Built as part of the self-learning roadmap, with a full conceptual walkthrough.", "event": "Self-learning roadmap", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["Node.js", "Express", "PostgreSQL", "Redis", "k6"]}, {"id": "e718096b97", "code": "", "name": "NanoLake", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A single-file SQL workbench that runs DuckDB entirely in the browser through WebAssembly. Drag in CSV, JSON or Parquet files, query them with SQL, chart the results as SVG and export to Parquet, with nothing uploaded. It has a minimal design with light and dark modes; a “Learn SQL” tab is a possible next step.", "event": "", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["DuckDB-Wasm", "JavaScript", "HTML", "CSS", "SVG"]}, {"id": "36c85adc91", "code": "", "name": "FlexSQL Workbench", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A browser-based generator for SQL mock data. You define tables and how they relate; it orders them with a DAG topological sort so parent rows are created before child rows and every foreign key stays valid.", "event": "", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["JavaScript", "HTML", "CSS", "SQL"]}, {"id": "adaf595b00", "code": "", "name": "Redactor (Blackout)", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "An offline, single-file web tool for hiding sensitive values before sharing. Upload a file or paste text and it redacts the parameters and fields you choose, all inside the browser. Phase 1 covers the simple flow; more phases are planned, and its ideas feed the my-pii and local-pii-shield libraries.", "event": "", "phase": "Simple phase 1", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["JavaScript", "HTML", "CSS"]}, {"id": "1ddd70139e", "code": "", "name": "token·lens", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A browser-based visualizer that shows how a transformer processes text, built for teaching and the portfolio. It trains a small BPE tokenizer live, draws attention as arcs between tokens, projects embeddings with PCA and shows the flow through the network. Phase 1 is done; it continues alongside the P2 Transformer project.", "event": "", "phase": "Phase 1", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["JavaScript", "HTML", "CSS"]}, {"id": "212d7c5914", "code": "", "name": "Image Copy", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "Single-file browser tool.", "event": "Browser tools", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["HTML", "CSS", "JavaScript"]}, {"id": "0068714e5c", "code": "", "name": "Postlab", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A mobile-friendly photo editor in a single file, made for preparing Instagram posts. It covers crop and aspect ratio, grade sliders, film-style looks (Fujifilm, Kodak and more), text layers and full-resolution export; colour adjustments use pixel maths so they work on older iPhones. A second tab designs post and story layouts from travel-style templates. Planned next: free crop and straighten, undo/redo and carousel slicing, then a PWA and app-store version.", "event": "Browser tools", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["JavaScript", "HTML", "CSS", "Canvas"]}, {"id": "bed97c5643", "code": "", "name": "Arveend OS", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "Personal project. Complete.", "event": "", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": []}, {"id": "aeb66ac733", "code": "", "name": "Seed Propagation", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "Done", "goal": "", "notes": "A personal digital garden and learning log in one browser file, with no database. Short notes and long posts grow from seedling to budding to evergreen, are linked with backlinks, and are found through tag and full-text search. Raw ideas move through brainstorm, draft and plan into managed projects, and everything syncs to a local JSON file.", "event": "", "phase": "Complete", "finished": "", "repo": "", "writeup": "", "tasks": [], "tools": ["JavaScript", "HTML", "CSS", "JSON"]}, {"id": "26b572ba26", "code": "", "name": "Power Automate Flow Builder", "track": "Portfolio", "color": "#8E8E93", "statusOverride": "On hol <script>
"use strict";

/* ============ constants ============ */
const STATUS = ["Not started","In progress","Done","Blocked","On hold","Dropped"];
const ST_COLOR = {"Not started":"#C7C7CC","In progress":"#007AFF","Done":"#34C759","Blocked":"#FF3B30","On hold":"#FF9500","Dropped":"#8E8E93"};
const TRACKS = ["Hackathon","Core","Library","Optional","Buffer","Side","Book","Content","Portfolio"];
const PALETTE = {Red:"#FF3B30",Blue:"#007AFF",Teal:"#0E8FA8",Indigo:"#5856D6",Pink:"#FF2D55",Purple:"#AF52DE",Green:"#248A3D",Rust:"#C93400",Ocean:"#0071A4",Violet:"#8944AB",Orange:"#D97A00",Olive:"#7D6608",Petrol:"#0B6E80",Navy:"#3634A3",Sienna:"#A0522D",Steel:"#2E6F9E",Plum:"#6B4F9E",Mint:"#00A38C",Gold:"#B8860B",Grey:"#8E8E93"};
const LS_KEY = "project-desk-v1";
const DAY = 86400000;
const CLOSED = new Set(["Done","Dropped","On hold"]);

/* ============ state ============ */
let state = null;
let fileHandle = null;      // File System Access handle (Chrome/Edge)
let fileName = "";
let dirty = false;          // unsaved to file
let lastSaved = null;
let view = "dashboard";
let filterTrack = "All";
let query = "";
let expanded = new Set();
let autosave = true;
let saveTimer = null;
let pendingHandle = null;   // remembered handle needing permission

/* ============ utils ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 12);
const t = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d); };
const iso = n => new Date(n).toISOString().slice(0, 10);
const today = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
const monday = n => n - ((new Date(n).getUTCDay() + 6) % 7) * DAY;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = s => { const n = typeof s === "number" ? s : t(s); if (n == null) return "—"; const d = new Date(n); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`; };
const num = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
const stCls = s => "st-" + String(s || "Not started").split(" ")[0];
const pill = s => `<span class="pill ${stCls(s)}">${esc(s || "—")}</span>`;
const chip = p => `<span class="chip" style="background:${esc(p.color)}">${esc(p.code || "•")}</span>`;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("on"), 1800); }

/* ============ derived ============ */
const work = p => p.tasks.filter(x => !x.milestone);
function span(p){
  let a = null, b = null;
  for (const x of p.tasks){ const s = t(x.start) ?? t(x.end), e = t(x.end) ?? t(x.start); if (s != null && (a == null || s < a)) a = s; if (e != null && (b == null || e > b)) b = e; }
  return [a, b];
}
const hours = p => work(p).reduce((s, x) => s + num(x.hrs), 0);
const doneHours = p => work(p).reduce((s, x) => s + num(x.hrs) * Math.min(1, num(x.pct)), 0);
function pct(p){
  const w = work(p); if (!w.length) return projStatus(p) === "Done" ? 1 : 0;
  const h = hours(p); if (h > 0) return doneHours(p) / h;
  return w.filter(x => x.status === "Done").length / w.length;
}
function projStatus(p){
  if (p.statusOverride) return p.statusOverride;
  const w = work(p); if (!w.length) return "Not started";
  const c = s => w.filter(x => x.status === s).length;
  if (c("Done") === w.length) return "Done";
  if (c("Dropped") === w.length) return "Dropped";
  if (c("Blocked")) return "Blocked";
  if (c("In progress") || c("Done")) return "In progress";
  if (c("On hold")) return "On hold";
  return "Not started";
}
const isPortfolio = p => p.track === "Portfolio";
const active = () => state.projects.filter(p => !isPortfolio(p));
function overdue(x){ const e = t(x.end); return e != null && e < today() && !CLOSED.has(x.status); }
function matches(p, x){
  if (!query) return true;
  const q = query.toLowerCase();
  const hay = [p.code, p.name, p.goal, p.notes, p.track, p.event, (p.tools || []).join(" "), x && x.title, x && x.code].join(" ").toLowerCase();
  return hay.includes(q) || (!x && p.tasks.some(k => (k.title + " " + k.code).toLowerCase().includes(q)));
}
const inTrack = p => filterTrack === "All" || p.track === filterTrack;

/* ============ persistence ============ */
function normalize(d){
  if (!d || !Array.isArray(d.projects)) throw new Error("Not a Project Desk file (no projects list).");
  d.settings = Object.assign({zoom: 18, deskName: "Project Desk", hideUndated: true}, d.settings || {});
  for (const p of d.projects){
    p.id ||= uid(); p.tasks ||= []; p.color ||= PALETTE.Blue; p.track ||= "Core"; if (!/^#/.test(p.color)) p.color = "#" + p.color;
    for (const k of ["code","name","statusOverride","goal","notes","event","phase","finished","repo","writeup"]) p[k] ??= "";
    p.tools = Array.isArray(p.tools) ? p.tools.map(String).map(s => s.trim()).filter(Boolean) : (typeof p.tools === "string" ? p.tools.split(",").map(s => s.trim()).filter(Boolean) : []);
    for (const x of p.tasks){ x.id ||= uid(); x.status ||= "Not started"; x.pct = num(x.pct); x.milestone = !!x.milestone; for (const k of ["code","title","deliverable","start","end"]) x[k] ??= ""; x.hrs ??= ""; }
  }
  if (!d.activity || typeof d.activity !== "object" || Array.isArray(d.activity)) d.activity = {};
  d.app = "ap-projects"; d.version = 1;
  return d;
}
function cacheLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({state, dirty, fileName, cachedAt: new Date().toISOString()})); } catch(e){} }
function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function bump(kind){ const k = iso(today()); const a = state.activity[k] || (state.activity[k] = [0, 0]); a[kind] = (a[kind] || 0) + 1; }
function changed(){
  bump(0); dirty = true; cacheLocal(); renderSync();
  if (fileHandle && autosave){ clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 900); }
}
function serialize(){ state.savedAt = new Date().toISOString(); return JSON.stringify(state, null, 1); }

// IndexedDB: remember the file handle between sessions (Chrome/Edge)
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open("project-desk", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ try { const db = await idb(); db.transaction("kv","readwrite").objectStore("kv").put(v, k); } catch(e){} }
async function idbGet(k){ try { const db = await idb(); return await new Promise(r => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch(e){ return null; } }
const fsa = "showOpenFilePicker" in window;

async function openFile(){
  if (dirty && !confirm("You have changes not saved to a file. Open another file anyway?")) return;
  if (fsa){
    try {
      const [h] = await showOpenFilePicker({types:[{description:"Project Desk JSON", accept:{"application/json":[".json"]}}]});
      await readHandle(h);
    } catch(e){ if (e.name !== "AbortError") alert("Could not open: " + e.message); }
  } else $("#fileInput").click();
}
async function readHandle(h){
  const f = await h.getFile();
  const d = normalize(JSON.parse(await f.text()));
  state = d; fileHandle = h; fileName = h.name; dirty = false; lastSaved = d.savedAt ? new Date(d.savedAt) : new Date(f.lastModified);
  pendingHandle = null; await idbSet("handle", h); cacheLocal(); render(); toast("Opened " + h.name);
}
$("#fileInput").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state = normalize(JSON.parse(await f.text())); fileHandle = null; fileName = f.name; dirty = false; lastSaved = new Date(f.lastModified); cacheLocal(); render(); toast("Loaded " + f.name + " (save downloads a copy)"); }
  catch(err){ alert("Could not read file: " + err.message); }
  e.target.value = "";
});
async function save(manual = true){
  try {
    if (fileHandle){
      const w = await fileHandle.createWritable(); await w.write(serialize()); await w.close();
      dirty = false; lastSaved = new Date(); cacheLocal(); renderSync(); if (manual) toast("Saved to " + fileName);
    } else if (manual) await saveAs();
  } catch(e){
    if (e.name === "NotAllowedError"){ fileHandle = null; renderSync(); alert("Permission to write the file was lost. Use Save as… to pick it again."); }
    else if (e.name !== "AbortError") alert("Save failed: " + e.message);
  }
}
async function saveAs(){
  if ("showSaveFilePicker" in window){
    try {
      const h = await showSaveFilePicker({suggestedName: fileName || "projects.json", types:[{description:"Project Desk JSON", accept:{"application/json":[".json"]}}]});
      fileHandle = h; fileName = h.name; await idbSet("handle", h); await save(true);
    } catch(e){ if (e.name !== "AbortError") alert("Save failed: " + e.message); }
  } else download();
}
function download(){
  const blob = new Blob([serialize()], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName || "projects.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  if (!fileHandle){ dirty = false; lastSaved = new Date(); cacheLocal(); renderSync(); }
  toast("Downloaded " + (fileName || "projects.json"));
}
function exportCSV(){
  const rows = [["Project code","Project","Track","Task code","Task","Type","Start","End","Hours","Status","% done","Deliverable"]];
  for (const p of state.projects) for (const x of p.tasks) rows.push([p.code,p.name,p.track,x.code,x.title,x.milestone?"Milestone":"Task",x.start,x.end,x.hrs,x.status,Math.round(num(x.pct)*100),x.deliverable]);
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = "project-desk-tasks.csv"; a.click();
}
async function reconnect(){
  if (!pendingHandle) return;
  try {
    const perm = await pendingHandle.requestPermission({mode:"readwrite"});
    if (perm !== "granted") return;
    const f = await pendingHandle.getFile(); const d = normalize(JSON.parse(await f.text()));
    const local = loadLocal();
    const fileTime = d.savedAt ? Date.parse(d.savedAt) : f.lastModified;
    const localTime = local && local.cachedAt ? Date.parse(local.cachedAt) : 0;
    if (local && local.dirty && localTime > fileTime){
      showBanner(`Your browser has newer unsaved changes than <b>${esc(pendingHandle.name)}</b>.`, [
        ["Keep browser changes & save", async () => { fileHandle = pendingHandle; fileName = fileHandle.name; pendingHandle = null; await save(true); hideBanner(); render(); }],
        ["Use the file", async () => { await readHandle(pendingHandle); hideBanner(); }]
      ]);
      return;
    }
    await readHandle(pendingHandle); hideBanner();
  } catch(e){ alert("Could not reconnect: " + e.message); }
}

/* ============ theme ============ */
const THEMES = [["auto", "Automatic", "auto"], ["light", "Light", "sun"], ["dark", "Dark", "moon"]];
function getTheme(){ try { const v = localStorage.getItem("project-desk-theme"); return v === "light" || v === "dark" ? v : "auto"; } catch(e){ return "auto"; } }
function setTheme(v){
  try { if (v === "auto") localStorage.removeItem("project-desk-theme"); else localStorage.setItem("project-desk-theme", v); } catch(e){}
  if (v === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  const b = $("#themeBtn"); if (b) b.innerHTML = ico(THEMES.find(x => x[0] === v)[2], 18);
  toast("Appearance: " + THEMES.find(x => x[0] === v)[1]);
}
function toggleThemeMenu(){
  if (document.querySelector(".menu.theme")){ closeMenus(); return; }
  closeMenus(); const cur = getTheme();
  const m = document.createElement("div"); m.className = "menu theme"; m.setAttribute("role", "menu"); m.style.minWidth = "200px";
  m.innerHTML = `<div class="pal-g" style="padding:6px 10px 4px">Appearance</div>` + THEMES.map(([k, l, i]) => `<button class="mi" role="menuitemradio" aria-checked="${k === cur}" data-th="${k}">${ico(i, 16)}${l}${k === cur ? `<span class="chk">${ico("check", 15, 2.4)}</span>` : ""}</button>`).join("");
  m.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { closeMenus(); setTheme(b.dataset.th); });
  m.addEventListener("click", e => e.stopPropagation());
  placeMenu(m, $("#themeBtn"));
}

function ring(v, size = 44, stroke = 5, color = "var(--blue)", label = true){

  return `<span class="ringwrap" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${stroke}"/>${p > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/>` : ""}</svg>${label ? `<b style="font-size:${Math.max(10, size/4.2)}px">${Math.round(p*100)}%</b>` : ""}</span>`;
}

  const [p, x] = findTask(key); if (!x) return;
  if (x.status === "Done"){ x.status = "In progress"; x.pct = Math.min(num(x.pct), .9) || 0; if (!x.pct) x.status = "Not started"; }
  else { x.status = "Done"; x.pct = 1; }

}

function renameDesk(){
  const el = $("#deskName"); const inp = document.createElement("input"); inp.value = state.settings.deskName || "Project Desk";

function syncInfo(){
  const ago = lastSaved ? timeAgo(lastSaved) : "";
  if (fileHandle) return dirty ? (autosave ? {dot:"busy", t:fileName, s:"Saving…"} : {dot:"warn", t:fileName, s:"Unsaved changes", act:["Save", () => save(true)]})
                               : {dot:"ok", t:fileName, s:`Saved ${ago}${autosave ? " · autosave on" : ""}`};
  if (pendingHandle) return {dot:"warn", t:pendingHandle.name, s:"Not connected", act:["Reconnect", reconnect]};
  if (fileName) return dirty ? {dot:"warn", t:fileName, s:"Changes not saved to a file", act:["Save a copy", () => save(true)]}
                             : {dot:"ok", t:fileName, s:`Downloaded ${ago}`};
  return {dot:"warn", t:"Browser only", s: dirty ? "Changes live in this browser" : "Save to a file to back up", act:[fsa ? "Save to file…" : "Download JSON", () => save(true)]};
}
function renderSync(){
  const s = syncInfo();
  $("#sync").innerHTML = `<div class="sync-card"><div class="sync-row"><span class="dot ${s.dot}"></span><div style="min-width:0"><div class="sync-t">${esc(s.t)}</div><div class="sync-s">${esc(s.s)}</div></div></div>${s.act ? `<button class="btn sm ${s.dot === "warn" ? "pri" : ""}" id="syncAct">${esc(s.act[0])}</button>` : ""}</div>`;
  if (s.act) $("#syncAct").onclick = s.act[1];
  const badge = $("#fileBadge"); if (badge) badge.hidden = !(dirty && !(fileHandle && autosave));
}
function timeAgo(d){ const s = (Date.now() - d.getTime()) / 1000; if (s < 45) return "just now"; if (s < 3600) return Math.round(s/60) + " min ago"; if (s < 86400) return Math.round(s/3600) + " h ago"; return d.toLocaleDateString(); }

/* ============ command palette ============ */
function openPalette(){
  if ($(".pal-scrim")) return; closeMenus();
  const host = document.createElement("div"); host.className = "pal-scrim";
  host.innerHTML = `<div class="pal" role="dialog" aria-label="Command palette"><div class="pal-in">${ico("search", 20)}<input placeholder="Jump to a project, task, view or action…" aria-label="Command"></div><div class="pal-list"></div></div>`;
  document.body.appendChild(host);
  const inp = host.querySelector("input"), list = host.querySelector(".pal-list"); let sel = 0, flat = [];
  const actions = [
    ...VIEWS.map(([k, l, i]) => ({g:"Go to", icon:i, label:l, run:() => go(k)})),
    {g:"Actions", icon:"plus", label:"New project", run:newProject},
    {g:"Actions", icon:"save", label: fileHandle ? "Save" : "Save to file…", run:() => save(true)},
    {g:"Actions", icon:"folder", label:"Open JSON file…", run:openFile},
    {g:"Actions", icon:"upload", label:"Import Excel…", run:() => $("#xlsxInput").click()},
    {g:"Actions", icon:"table", label:"Export Excel", run:exportXlsx},
    {g:"Actions", icon:"layers", label:"Merge JSON…", run:() => $("#jsonMergeInput").click()},
    ...THEMES.map(([k, l, i]) => ({g:"Actions", icon:i, label:"Appearance: " + l, run:() => setTheme(k)})),
    {g:"Actions", icon:"download", label:"Export CSV", run:exportCSV},
    {g:"Actions", icon:"download", label:"Backup JSON", run:download},
  ];
  const build = q => {
    q = q.toLowerCase().trim();
    const sc = s => { s = s.toLowerCase(); if (!q) return 1; if (s.startsWith(q)) return 3; if (s.includes(" " + q)) return 2; return s.includes(q) ? 1 : 0; };
    const res = [];
    for (const a of actions){ const s = sc(a.label); if (s) res.push({...a, s}); }
    for (const p of state.projects){ const s = Math.max(sc(p.name), sc(p.code || "")); if (s) res.push({g:"Projects", chip:p, label:p.name, sub:p.track, s: s + .5, run:() => openEditor(p.id)}); }
    if (q.length >= 2) for (const p of state.projects) for (const x of p.tasks){ const s = Math.max(sc(x.title), sc(x.code || "")); if (s) res.push({g:"Tasks", chip:p, label:x.title || x.code, sub:`${x.code} · ${x.status}`, s, run:() => { editorTab = "tasks"; openEditor(p.id); }}); }
    const order = ["Go to","Actions","Projects","Tasks"];
    const groups = order.map(g => [g, res.filter(r => r.g === g).sort((a, b) => b.s - a.s).slice(0, q ? 8 : (g === "Projects" ? 6 : 8))]).filter(g => g[1].length);
    flat = groups.flatMap(g => g[1]); sel = Math.min(sel, Math.max(0, flat.length - 1));
    let i = 0;
    list.innerHTML = groups.map(([g, rs]) => `<div class="pal-g">${g}</div>` + rs.map(r => `<button class="mi ${i === sel ? "sel" : ""}" data-pi="${i++}">${r.chip ? chip(r.chip) : ico(r.icon, 16)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>${r.sub ? `<span class="sub">${esc(r.sub)}</span>` : ""}</button>`).join("")).join("") || `<div class="empty">No matches</div>`;
    list.querySelectorAll("[data-pi]").forEach(b => { b.onclick = () => run(+b.dataset.pi); b.onmousemove = () => { if (sel !== +b.dataset.pi){ sel = +b.dataset.pi; mark(); } }; });
  };
  const mark = () => list.querySelectorAll("[data-pi]").forEach(b => b.classList.toggle("sel", +b.dataset.pi === sel));
  const close = () => host.remove();
  const run = i => { const r = flat[i]; close(); if (r) r.run(); };
  inp.oninput = () => { sel = 0; build(inp.value); };
  inp.onkeydown = e => {
    if (e.key === "ArrowDown"){ e.preventDefault(); sel = Math.min(flat.length - 1, sel + 1); mark(); list.querySelector(".sel")?.scrollIntoView({block:"nearest"}); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); sel = Math.max(0, sel - 1); mark(); list.querySelector(".sel")?.scrollIntoView({block:"nearest"}); }
    else if (e.key === "Enter"){ e.preventDefault(); run(sel); }
    else if (e.key === "Escape"){ e.preventDefault(); close(); }
  };
  host.addEventListener("mousedown", e => { if (e.target === host) close(); });
  build(""); inp.focus();
}

/* ============ keyboard ============ */
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); save(true); return; }
  if (mod && e.key.toLowerCase() === "o"){ e.preventDefault(); openFile(); return; }
  if (e.key === "Escape"){ if ($(".menu")) closeMenus(); else if ($(".drawer")) closeEditor(); return; }
  if (typing || mod || e.altKey || $(".pal-scrim") || $(".scrim")) return;
  if (e.key === "/"){ e.preventDefault(); $("#q").focus(); }
  else if (e.key.toLowerCase() === "n" && !$(".drawer")){ e.preventDefault(); newProject(); }
  else if (/^[1-5]$/.test(e.key) && !$(".drawer")) go(VIEWS[+e.key - 1][0]);
});

/* ============ tooltip ============ */
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]"), tip = $("#tip");
  if (!el){ tip.classList.remove("on"); return; }
  try { const [h, ...ls] = JSON.parse(el.dataset.tip); tip.innerHTML = `<b>${esc(h)}</b>${ls.map(l => `<div>${esc(l)}</div>`).join("")}`; } catch(_){ return; }
  tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  const tip = $("#tip"); if (!tip.classList.contains("on")) return;
  const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = Math.min(window.innerHeight - tip.offsetHeight - 12, e.clientY + 16);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

/* ---------- activity heatmap ---------- */
function activityCard(){
  const T = today(), A = state.activity || {};
  const start = monday(T) - 52*7*DAY, weeks = 53;
  const lvl = a => { if (!a) return 0; const e = a[0] || 0, v = a[1] || 0; if (!e) return v ? 1 : 0; return e < 3 ? 1 : e < 10 ? 2 : e < 25 ? 3 : 4; };
  let cells = "", months = "", lastM = -1;
  for (let w = 0; w < weeks; w++){
    const wd = new Date(start + w*7*DAY);
    if (wd.getUTCMonth() !== lastM && wd.getUTCDate() <= 7){ lastM = wd.getUTCMonth(); months += `<span style="grid-column:${w+1}">${MON[lastM]}</span>`; }
    for (let d = 0; d < 7; d++){
      const day = start + (w*7 + d)*DAY, k = iso(day), a = A[k];
      if (day > T){ cells += `<i class="fut"></i>`; continue; }
      const e = a ? a[0] || 0 : 0, v = a ? a[1] || 0 : 0;
      const lines = e || v ? [`${e} change${e === 1 ? "" : "s"}`, `${v} visit${v === 1 ? "" : "s"}`] : ["No activity"];
      cells += `<i class="l${lvl(a)} ${day === T ? "tdy" : ""}" ${tipAttr(new Date(day).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:"UTC"}), lines)}></i>`;
    }
  }
  // stats
  const days = Object.keys(A).filter(k => (A[k][0] || 0) + (A[k][1] || 0) > 0).sort();
  const yearAgo = iso(T - 365*DAY);
  const activeYear = days.filter(k => k >= yearAgo).length;
  const totalEdits = Object.values(A).reduce((s, a) => s + (a[0] || 0), 0);
  let cur = 0; for (let d = T; ; d -= DAY){ const a = A[iso(d)]; if (a && (a[0] || a[1])) cur++; else if (d === T) continue; else break; if (cur > 3650) break; }
  let best = 0, run = 0, prev = null;
  for (const k of days){ const n = t(k); run = prev != null && n - prev === DAY ? run + 1 : 1; best = Math.max(best, run); prev = n; }
  const wk = Array.from({length: 7}, (_, i) => A[iso(monday(T) + i*DAY)]).reduce((s, a) => s + (a ? a[0] || 0 : 0), 0);
  const first = days[0];
  return `<div class="card"><div class="card-h">${ico("activity", 17)}<h3>Activity</h3><span class="ct">${first ? "since " + fmt(first) : "starts today"}</span></div>
    <div class="hm-stats"><div><b>${activeYear}</b><span>active days</span></div><div><b>${cur}</b><span>day streak</span></div><div><b>${best}</b><span>longest streak</span></div><div><b>${wk}</b><span>changes this week</span></div></div>
    <div class="hm-wrap" id="hmWrap"><div class="hm"><div></div><div class="hm-months" style="grid-template-columns:repeat(${weeks},11px)">${months}</div>
      <div class="hm-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div class="hm-grid">${cells}</div></div></div>
    <div class="hm-foot"><span>${totalEdits.toLocaleString()} changes recorded · a visit with no edits counts as light activity</span><span class="hm-legend">Less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> More</span></div></div>`;
}
function toolsCard(){
  const c = {}, where = {};
  for (const p of state.projects) for (const s of p.tools || []){ c[s] = (c[s] || 0) + 1; (where[s] ||= []).push(p.code || p.name); }
  const top = Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));

  return `<div class="card" style="margin-top:16px"><div class="card-h">${ico("bolt", 17)}<h3>Tools used</h3><span class="ct">${top.length} tools across ${state.projects.filter(p => (p.tools || []).length).length} projects · click one to see its projects</span></div>
    <div class="tools">${top.slice(0, 40).map(([s, n]) => `<button class="tool" data-tool="${esc(s)}" ${tipAttr(s, [`${n} project${n === 1 ? "" : "s"}`, where[s].slice(0, 8).join(", ") + (where[s].length > 8 ? "…" : "")])}>${esc(s)}<span class="faint" style="margin-left:5px">${n}</span></button>`).join("")}${top.length > 40 ? `<span class="tool tmore">+${top.length - 40} more</span>` : ""}</div></div>`;
