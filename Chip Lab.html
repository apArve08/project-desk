/* ---------- transistor view (CMOS switch-level) ---------- */
const TVDEF = (() => {
  const P = (id, x, y, g, top, bot, stage) => ({id, t:"p", x, y, g, top, bot, stage:stage || 1});
  const N = (id, x, y, g, top, bot, stage) => ({id, t:"n", x, y, g, top, bot, stage:stage || 1});
  const inverter = (x, gnet) => ({
    tr:[P("P2", x, 120, gnet, "VDD", "Y", 2), N("N2", x, 320, gnet, "Y", "GND", 2)],
    segs:[["VDD", [[x, 84], [x, 40]]], ["Y", [[x, 156], [x, 284]]], ["Y", [[x, 220], [x + 100, 220]]], ["GND", [[x, 356], [x, 440]]],
          [gnet, [[420, 120], [420, 320]]], [gnet, [[420, 120], [x - 48, 120]]], [gnet, [[420, 320], [x - 48, 320]]]]
  });
  const nand = o => ({
    tr:[P("PA", 200, 120, "A", "VDD", o), P("PB", 360, 120, "B", "VDD", o), N("NA", 280, 290, "A", o, "M"), N("NB", 280, 390, "B", "M", "GND")],
    segs:[["VDD", [[200, 84], [200, 40]]], ["VDD", [[360, 84], [360, 40]]], [o, [[200, 156], [200, 200], [o === "Y" ? 460 : 420, 200]]],
          [o, [[360, 156], [360, 200]]], [o, [[280, 254], [280, 200]]], ["M", [[280, 326], [280, 354]]], ["GND", [[280, 426], [280, 440]]]],
    labels:[{x:292, y:344, t:"M"}]
  });
  const nor = o => ({
    tr:[P("PA", 280, 100, "A", "VDD", "M"), P("PB", 280, 190, "B", "M", o), N("NA", 200, 360, "A", o, "GND"), N("NB", 360, 360, "B", o, "GND")],
    segs:[["VDD", [[280, 64], [280, 40]]], ["M", [[280, 136], [280, 154]]], [o, [[280, 226], [280, 280]]],
          [o, [[200, 324], [200, 280], [o === "Y" ? 460 : 420, 280]]], [o, [[360, 324], [360, 280]]], ["GND", [[200, 396], [200, 440]]], ["GND", [[360, 396], [360, 440]]]],
    labels:[{x:292, y:149, t:"M"}]
  });
  const two = (first, firstName) => {
    const inv = inverter(560, "X");
    return { w:740, inputs:["A", "B"], rail:[150, 620], out:{x:660, y:220},
      tr:first.tr.concat(inv.tr), segs:first.segs.concat(inv.segs),
      labels:(first.labels || []).concat([{x:428, y:110, t:"X"}]),
      stages:[{x:280, t:`Stage 1 · ${firstName}`}, {x:560, t:"Stage 2 · NOT"}], firstName };
  };
  return {
    NOT:{ w:460, inputs:["A"], rail:[150, 340], out:{x:360, y:220},
      tr:[P("P1", 240, 120, "A", "VDD", "Y"), N("N1", 240, 320, "A", "Y", "GND")],
      segs:[["VDD", [[240, 84], [240, 40]]], ["Y", [[240, 156], [240, 284]]], ["Y", [[240, 220], [360, 220]]], ["GND", [[240, 356], [240, 440]]]],
      note:"One pMOS on top, one nMOS below, with their gates tied together. Whatever the input, exactly one of them is on." },
    NAND:Object.assign({ w:560, inputs:["A", "B"], rail:[150, 420], out:{x:460, y:200},
      note:"The pMOS transistors sit side by side (parallel): either one can pull Y up to 1. The nMOS transistors are stacked (series): both must be on to pull Y down to 0. So Y is 0 only when A and B are both 1." }, nand("Y")),
    NOR:Object.assign({ w:560, inputs:["A", "B"], rail:[150, 420], out:{x:460, y:280},
      note:"The mirror image of NAND: pMOS stacked in series, nMOS side by side in parallel. Y is 1 only when A and B are both 0." }, nor("Y")),
    AND:Object.assign(two(nand("X"), "NAND"), {
      note:"A single CMOS stage always inverts, so there's no direct AND. Chips build it as NAND followed by NOT, which is why AND costs 6 transistors and NAND only 4." }),
    OR:Object.assign(two(nor("X"), "NOR"), {
      note:"Same trick as AND: a NOR stage followed by an inverter. 6 transistors, versus 4 for NOR on its own." }),
    XOR:xorDef(false),
    XNOR:xorDef(true)
  };
  function xorDef(xnor){
    const b1 = xnor ? "Bn" : "B", b2 = xnor ? "B" : "Bn";
    const tr = [
      P("IAp", 150, 120, "A", "VDD", "An"), N("IAn", 150, 320, "A", "An", "GND"),
      P("IBp", 270, 120, "B", "VDD", "Bn"), N("IBn", 270, 320, "B", "Bn", "GND"),
      P("PA", 420, 96, "A", "VDD", "M1", 2), P("PB", 560, 96, b1, "VDD", "M1", 2),
      P("PAn", 420, 186, "An", "M1", "Y", 2), P("PBn", 560, 186, b2, "M1", "Y", 2),
      N("NA", 420, 290, "A", "Y", "M2", 2), N("NB", 420, 384, b1, "M2", "GND", 2),
      N("NAn", 560, 290, "An", "Y", "M3", 2), N("NBn", 560, 384, b2, "M3", "GND", 2)
    ];
    const segs = [
      ["VDD", [[150, 84], [150, 40]]], ["An", [[150, 156], [150, 284]]], ["An", [[150, 220], [200, 220]]], ["GND", [[150, 356], [150, 440]]],
      ["VDD", [[270, 84], [270, 40]]], ["Bn", [[270, 156], [270, 284]]], ["Bn", [[270, 220], [320, 220]]], ["GND", [[270, 356], [270, 440]]],
      ["VDD", [[420, 60], [420, 40]]], ["VDD", [[560, 60], [560, 40]]],
      ["M1", [[420, 132], [420, 150]]], ["M1", [[560, 132], [560, 150]]], ["M1", [[420, 141], [560, 141]]],
      ["Y", [[420, 222], [420, 240], [640, 240]]], ["Y", [[560, 222], [560, 240]]],
      ["Y", [[420, 254], [420, 240]]], ["Y", [[560, 254], [560, 240]]],
      ["M2", [[420, 326], [420, 348]]], ["M3", [[560, 326], [560, 348]]],
      ["GND", [[420, 420], [420, 440]]], ["GND", [[560, 420], [560, 440]]]
    ];
    return { w:720, inputs:["A", "B"], rail:[110, 600], out:{x:640, y:240}, tr, segs,
      alias:{An:"Ā", Bn:"B̄"},
      labels:[{x:206, y:224, t:"Ā"}, {x:326, y:224, t:"B̄"}, {x:574, y:137, t:"M1"}],
      stages:[{x:210, t:"Stage 1 · 2 × NOT"}, {x:490, t:`Stage 2 · ${xnor ? "XNOR" : "XOR"} network`}],
      explain:r => `<b>Stage 1 makes the inverted inputs:</b> Ā = ${r.val.An}, B̄ = ${r.val.Bn}. ` + explainStage(TVDEF[xnor ? "XNOR" : "XOR"], r, 2, "Y", "Y"),
      note: xnor
        ? "XNOR is the XOR network with B and B̄ swapped: Y = 1 when the inputs match. The top network connects Y to VDD if (A or B̄) and (Ā or B); the bottom network connects it to GND if the inputs differ."
        : "Y = 1 when the inputs differ. The top network is two parallel pairs in series: (A or B is 0) and (A or B is 1). The bottom network is two series pairs in parallel: A and B both 1, or both 0. Two inverters supply Ā and B̄, so this classic design uses 12 transistors. Compact transmission-gate versions use 6 to 8." };
  }
})();

function solveTV(def, inputs){
  const val = {VDD:1, GND:0}; def.inputs.forEach(k => val[k] = inputs[k] ? 1 : 0);
  const fixed = new Set(Object.keys(val));
  let on = [], parent = {};
  const find = a => { while (parent[a] && parent[a] !== a) a = parent[a]; return a; };
  for (let it = 0; it < 10; it++){
    on = def.tr.map(t => { const g = val[t.g]; if (g !== 0 && g !== 1) return false; return t.t === "n" ? g === 1 : g === 0; });
    parent = {};
    const nets = new Set(["VDD", "GND"]); def.tr.forEach(t => { nets.add(t.top); nets.add(t.bot); });
    nets.forEach(n => parent[n] = n);
    def.tr.forEach((t, i) => { if (on[i]){ const a = find(t.top), b = find(t.bot); if (a !== b) parent[a] = b; } });
    const gv = {}; nets.forEach(n => { const r = find(n); if (n === "VDD") gv[r] = gv[r] === 0 ? "X" : 1; if (n === "GND") gv[r] = gv[r] === 1 ? "X" : 0; });
    let changed = false;
    nets.forEach(n => { if (fixed.has(n)) return; const v = gv[find(n)] ?? "Z"; if (val[n] !== v){ val[n] = v; changed = true; } });
    if (!changed) break;
  }
  return {val, on, find};
}

const tv = {type:"NAND", inputs:{A:0, B:0}};
function trSVG(t, on, val, zoomable){
  const c = v => v === 1 ? "hi" : v === 0 ? "lo" : "fl";
  const {x, y} = t, p = t.t === "p";
  let s = `<rect class="tr-bg${on ? " on" : ""}${zoomable ? " ztr" : ""}"${zoomable ? ` data-z="tr:${t.id}"` : ""} x="${x - 26}" y="${y - 30}" width="80" height="60" rx="12"/>`;
  s += `<line class="net ${c(val[t.top])}" x1="${x}" y1="${y - 36}" x2="${x}" y2="${y - 18}"/>`;
  s += `<line class="net ${c(val[t.bot])}" x1="${x}" y1="${y + 18}" x2="${x}" y2="${y + 36}"/>`;
  s += `<line class="chan${on ? " on" : ""}" x1="${x}" y1="${y - 18}" x2="${x}" y2="${y + 18}"/>`;
  s += `<line class="plate" x1="${x - 10}" y1="${y - 14}" x2="${x - 10}" y2="${y + 14}"/>`;
  s += `<line class="net ${c(val[t.g])}" x1="${x - 48}" y1="${y}" x2="${p ? x - 18 : x - 10}" y2="${y}"/>`;
  if (p) s += `<circle class="bubble" cx="${x - 14}" cy="${y}" r="4"/>`;
  s += `<text class="tr-name" x="${x + 12}" y="${y - 4}">${p ? "pMOS" : "nMOS"}</text><text class="tr-st${on ? " on" : ""}" x="${x + 12}" y="${y + 12}">${on ? "ON" : "OFF"}</text>`;
  return s;
}
function trName(t){ return `${t.t}MOS ${({X:"(X)", An:"Ā", Bn:"B̄", Q:"(Q)", Qn:"(Q̄)", WL:"(WL)"})[t.g] || t.g}`; }
function listNames(a){ const n = a.map(trName); return n.length <= 1 ? (n[0] || "") : n.slice(0, -1).join(", ") + " and " + n[n.length - 1]; }
function explainStage(def, r, stage, outNet, label){
  const trs = def.tr.map((t, i) => ({t, on:r.on[i]})).filter(o => o.t.stage === stage);
  const v = r.val[outNet]; const root = r.find(outNet);
  const wantOff = v === 1 ? "n" : "p";
  const path = trs.filter(o => o.on && o.t.t !== wantOff && r.find(o.t.top) === root).map(o => o.t);
  const off = trs.filter(o => !o.on && o.t.t === wantOff).map(o => o.t);
  const anyOnOther = trs.filter(o => o.on && o.t.t === wantOff).map(o => o.t);
  let s = `<b>${label} = ${v}.</b> ${label} is connected to <b>${v ? "VDD" : "GND"}</b> through ${listNames(path)}.`;
  if (off.length) s += ` ${listNames(off)} ${off.length > 1 ? "are" : "is"} off`;
  if (anyOnOther.length && off.length) s += ` (${listNames(anyOnOther)} ${anyOnOther.length > 1 ? "are" : "is"} on, but that alone doesn't complete the path)`;
  if (off.length) s += `, so there's no path to ${v ? "GND" : "VDD"}.`;
  return s;
}
function tvMarkup(def, inputs, zoomable){
  const r = solveTV(def, inputs); const val = r.val;
  const c = v => v === 1 ? "hi" : v === 0 ? "lo" : "fl";
  const outRoot = r.find("Y");
  const pathType = val.Y === 1 ? "p" : "n";
  const outStage = Math.max(...def.tr.map(t => t.stage || 1));
  const pathTr = def.tr.map((t, i) => r.on[i] && t.t === pathType && (t.stage || 1) === outStage && r.find(t.top) === outRoot);
  const pathNets = new Set(["Y"]); def.tr.forEach((t, i) => { if (pathTr[i]){ pathNets.add(t.top); pathNets.add(t.bot); } });
  const inPath = net => pathNets.has(net) && net !== "VDD" && net !== "GND";
  let glow = "", nets = "", trs = "", extra = "";
  // rails
  nets += `<line class="net hi rail" x1="${def.rail[0]}" y1="40" x2="${def.rail[1]}" y2="40"/><text class="rail-lbl" x="${def.rail[0] - 10}" y="44" text-anchor="end">VDD · 1</text>`;
  nets += `<line class="net lo rail" x1="${def.rail[0]}" y1="440" x2="${def.rail[1]}" y2="440"/><text class="rail-lbl" x="${def.rail[0] - 10}" y="444" text-anchor="end">GND · 0</text>`;
  for (const [net, pts] of def.segs){
    const d = "M" + pts.map(p => p.join(",")).join(" L");
    if (inPath(net) || ((net === "VDD" || net === "GND") && pathNets.has(net) && pts.some(p => def.tr.some((t, i) => pathTr[i] && t.x === p[0] && (t.top === net || t.bot === net))))) glow += `<path class="glow" d="${d}"/>`;
    nets += `<path class="net ${c(val[net])}" d="${d}"/>`;
  }
  def.tr.forEach((t, i) => {
    if (pathTr[i]) glow += `<line class="glow" x1="${t.x}" y1="${t.y - 36}" x2="${t.x}" y2="${t.y + 36}"/>`;
    trs += trSVG(t, r.on[i], val, zoomable);
    if (def.inputs.includes(t.g)){
      extra += `<g class="tv-in" data-tvin="${t.g}"><circle class="in-dot ${c(val[t.g])}" cx="${t.x - 48}" cy="${t.y}" r="8"/><text class="in-lbl" x="${t.x - 62}" y="${t.y + 5}" text-anchor="end">${t.g}</text></g>`;
    } else if (def.alias && def.alias[t.g]){
      extra += `<circle class="in-dot ${c(val[t.g])}" cx="${t.x - 48}" cy="${t.y}" r="6"/><text class="in-lbl" x="${t.x - 58}" y="${t.y + 5}" text-anchor="end" style="font-size:13px">${def.alias[t.g]}</text>`;
    }
  });
  (def.labels || []).forEach(l => { extra += `<text class="net-lbl" x="${l.x}" y="${l.y}">${l.t}</text>`; });
  (def.stages || []).forEach(s => { extra += `<text class="stage-lbl" x="${s.x}" y="474" text-anchor="middle">${esc(s.t)}</text>`; });
  const y = val.Y;
  extra += `<circle class="led${y === 1 ? " on" : ""}" cx="${def.out.x + 22}" cy="${def.out.y}" r="14"/><text class="led-v" x="${def.out.x + 22}" y="${def.out.y + 4}" text-anchor="middle">${y}</text>
    <text class="in-lbl" x="${def.out.x + 44}" y="${def.out.y + 5}">Y</text>`;
  return {inner:glow + nets + trs + extra, r, w:def.w};
}
function renderTV(){
  const def = TVDEF[tv.type]; const m = tvMarkup(def, tv.inputs, false); const r = m.r, val = r.val, y = val.Y;
  const svg = $("#tvSvg");
  svg.setAttribute("viewBox", `0 0 ${def.w} 490`);
  svg.innerHTML = m.inner;

  $("#tvTitle").textContent = `Inside the ${tv.type} gate`;
  $("#tvSeg").innerHTML = ["NOT", "NAND", "NOR", "AND", "OR", "XOR", "XNOR"].map(k => `<button data-tvgate="${k}" aria-pressed="${k === tv.type}">${k}</button>`).join("");

  // explanation
  let ex = "";
  if (def.explain){
    ex = `<p class="explain">${def.explain(r)}</p>`;
  } else if (def.stages){
    ex = `<p class="explain">${explainStage(def, r, 1, "X", "X")}</p>
      <p class="explain"><b>Stage 2 inverts it.</b> ${explainStage(def, r, 2, "Y", "Y")}</p>`;
  } else ex = `<p class="explain">${explainStage(def, r, 1, "Y", "Y")}</p>`;
  // truth table
  const ins = def.inputs, rows = [];
  for (let k = 0; k < (1 << ins.length); k++){
    const o = {}; ins.forEach((n, i) => o[n] = (k >> (ins.length - 1 - i)) & 1);
    rows.push({bits:ins.map(n => o[n]), y:solveTV(def, o).val.Y});
  }
  const cur = ins.reduce((t, n) => t * 2 + (tv.inputs[n] ? 1 : 0), 0);
  const nOn = r.on.filter(Boolean).length;
  $("#tvSide").innerHTML = `
    <section class="block"><h2 class="sec">Inputs</h2>
      <div class="tv-io">${ins.map(n => `<button class="pill${tv.inputs[n] ? " on" : ""}" data-tvin="${n}" aria-pressed="${!!tv.inputs[n]}">${n} <span class="b">${tv.inputs[n] ? 1 : 0}</span></button>`).join("")}</div>
      <p class="note">Click a pill or an input dot on the schematic to flip it.</p></section>
    <section class="block"><h2 class="sec">Output</h2><div class="tv-out"><span class="dot${y === 1 ? " on" : ""}"></span>Y = ${y}</div>
      <p class="stats">${def.tr.length} transistors · ${nOn} on · ${def.tr.length - nOn} off</p></section>
    <section class="block" aria-live="polite"><h2 class="sec">What's happening</h2>${ex}</section>
    <section class="block"><h2 class="sec">Truth table</h2><div class="tt-wrap"><table class="tt"><thead><tr>${ins.map(n => `<th>${n}</th>`).join("")}<th class="sep">Y</th></tr></thead>
      <tbody>${rows.map((rw, i) => `<tr${i === cur ? ' class="cur"' : ""}>${rw.bits.map(b => `<td class="${b ? "one" : "zero"}">${b}</td>`).join("")}<td class="sep ${rw.y ? "one" : "zero"}">${rw.y}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="block"><h2 class="sec">How it's wired</h2><p class="explain">${esc(def.note)}</p></section>
    <section class="block"><h2 class="sec">Key</h2>
      <div class="legend">
        <svg width="28" height="10"><line class="net hi" x1="2" y1="5" x2="26" y2="5"/></svg><span>Wire at 1, connected to VDD (power)</span>
        <svg width="28" height="10"><line class="net lo" x1="2" y1="5" x2="26" y2="5"/></svg><span>Wire at 0, connected to GND (ground)</span>
        <svg width="28" height="10"><line class="net fl" x1="2" y1="5" x2="26" y2="5"/></svg><span>Floating: not connected to either</span>
        <svg width="28" height="16"><rect x="2" y="1" width="24" height="14" rx="4" fill="var(--conduct-a)" stroke="var(--conduct)"/></svg><span>Transistor on: its switch is closed</span>
        <svg width="28" height="16"><line class="glow" x1="4" y1="8" x2="24" y2="8" style="stroke-width:10"/></svg><span>The path that sets the output</span>
      </div>
      <p class="note">nMOS turns on when its gate is 1. pMOS (the one with the bubble) turns on when its gate is 0.</p></section>
    <p class="insight"><b>Why CMOS won:</b> the pMOS network on top and the nMOS network below are mirror images. For every input, exactly one of them connects the output, so there's never a direct path from power to ground. An idle CMOS gate uses almost no power, which is how billions of them fit on one chip.</p>`;
}
function openTV(type, inputs){
  if (!TVDEF[type]){ toast(`There's no transistor view for ${type}.`); return; }
  tv.type = type; tv.inputs = Object.assign({A:0, B:0}, inputs || {});
  $("#tv").hidden = false; renderTV(); $("#tvClose").focus();
}
function openTVFor(n){ const s = board.sim; openTV(n.type, {A:s.inv(n, 0), B:s.inv(n, 1)}); }
function closeTV(){ $("#tv").hidden = true; }
board.cb.gate = n => openTVFor(n);
$("#tvBtn").addEventListener("click", () => {
  const sel = state.mode === "build" && board.sel && board.sel.node && board.sim.byId.get(board.sel.node);
  if (sel && TVDEF[sel.type]) openTVFor(sel); else openTV(tv.type, tv.inputs);
});
$("#tvClose").addEventListener("click", closeTV);
$("#tv").addEventListener("pointerdown", e => { if (e.target === $("#tv")) closeTV(); });
$("#tv").addEventListener("click", e => {
  const g = e.target.closest("[data-tvgate]"); if (g){ tv.type = g.dataset.tvgate; renderTV(); return; }
  const i = e.target.closest("[data-tvin]"); if (i){ const k = i.dataset.tvin; tv.inputs[k] = tv.inputs[k] ? 0 : 1; renderTV(); }
});

function raceState(){

  for (let k = 0; k < 4; k++) for (let j = 0; j < 4; j++){ const x = gx + j * (cw + gp) + cw / 2; s += cell(x, 52 + k * 26, n.W[k][j], n.step - j === k); }
  s += `<text class="rowlbl" x="24" y="${gy - 14}">A →</text>`;
  for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++){ const y = gy + i * (chh + gp) + chh / 2; s += cell(36 + k * 34, y, n.A[i][k], n.step - i === k); }

    const l3 = ps.waiting ? "" : `acc = ${ps.active ? ps.after : ps.final}`;
    s += `<g class="ztarget" data-z="pe:${i}:${j}"><rect class="st ${cls}" x="${x}" y="${y}" width="${cw}" height="${chh}" rx="12"/>
      <text class="st-s" x="${x + 10}" y="${y + 20}">PE ${i},${j}</text><text class="st-t" x="${x + 10}" y="${y + 46}">${l2}</text><text class="st-s${ps.active ? " hl" : ""}" x="${x + 10}" y="${y + 70}">${l3}</text></g>`;
    if (j < 3) s += arrow(x + cw, y + chh / 2, x + cw + gp - 2, y + chh / 2);
    if (i < 3) s += arrow(x + cw / 2, y + chh, x + cw / 2, y + chh + gp - 2);

  s += `<text class="st-s" x="${gx}" y="${gy + 4 * (chh + gp) + 14}">${busy} of 16 PEs busy this tick · A flows right, W flows down, results stay put</text>`;

}
function zPE(i, j){

  let s = ZDEFS + `<text class="stage-lbl" x="40" y="34">PE (${i}, ${j}) · computes C[${i}][${j}] · ${status}</text>`;
  s += `<text class="st-t" x="40" y="186">a = ${ps.a}</text><text class="st-s" x="40" y="206">from the left</text>` + arrow(40, 220, 150, 220);
  s += `<text class="st-t" x="252" y="74">w = ${ps.w}</text><text class="st-s" x="252" y="94">from above</text>` + arrow(245, 104, 245, 150);
  s += `<g class="ztarget" data-z="mul"><rect class="st act2${ps.active ? " pulse" : ""}" x="150" y="150" width="190" height="130" rx="14" style="stroke-width:2.5"/><text class="st-t" x="166" y="180">Multiplier</text>
    <text class="st-t" x="166" y="218" style="font-size:20px">${ps.a} × ${ps.w} = ${ps.prod}</text><text class="st-s" x="166" y="252">click to look inside</text></g>`;
  s += arrow(340, 215, 410, 215);
  s += `<g class="ztarget" data-z="peadd"><rect class="st act2${ps.active ? " pulse" : ""}" x="410" y="150" width="190" height="130" rx="14" style="stroke-width:2.5"/><text class="st-t" x="426" y="180">Adder</text>
    <text class="st-t" x="426" y="218" style="font-size:20px">${ps.before} + ${ps.prod} = ${ps.after}</text><text class="st-s" x="426" y="252">click to look inside</text></g>`;
  s += arrow(600, 215, 670, 215) + zbox(670, 170, 190, 90, "act2", "acc register", [[`= ${ps.waiting ? 0 : ps.active ? ps.after : ps.final}`, 1], ["keeps the running sum"]]);

  return s;
}

/* ---------- ticking ---------- */
function zTick(){
  Z.prev = addState(Z.x, Z.B); Z.x = Z.prev.S; Z.tick++;
  const f = zTop(), cpuAdder = f.t === "adder" && Z.stack[Z.stack.length - 2].t === "core";
  if (reduceMotion() || !cpuAdder){ Z.ripple = 8; zRender(); return; }
  Z.ripple = 0; zRender(); clearTimeout(Z.rt);
  const step = Math.max(25, Math.min(90, (1000 / Z.speed) / 12));
  const go = () => { Z.ripple++; zRender(); if (Z.ripple < 8) Z.rt = setTimeout(go, step); };
  Z.rt = setTimeout(go, step);
}
function zLoop(){ clearTimeout(Z.tmr); if (state.mode !== "zoom" || !Z.playing) return; Z.tmr = setTimeout(() => { zTick(); zLoop(); }, 1000 / Z.speed); }
function zStop(){ clearTimeout(Z.tmr); clearTimeout(Z.rt); }
function zEnter(){ Z.last = ""; Z.leftKey = ""; zRender(); zLoop(); }

/* ---------- zoom-in animation + clicks ---------- */
function zZoomInto(el, apply){
  const svg = $("#zsvg");
  const finish = () => { apply(); Z.last = ""; Z.ripple = 8; zRender(); requestAnimationFrame(() => svg.classList.remove("fade")); Z.anim = false; };
  if (reduceMotion()){ finish(); return; }
  const m = svg.getScreenCTM(); if (!m){ finish(); return; }
  const inv = m.inverse(), rc = el.getBoundingClientRect();
  const p1 = new DOMPoint(rc.left, rc.top).matrixTransform(inv), p2 = new DOMPoint(rc.right, rc.bottom).matrixTransform(inv);
  const vb = svg.viewBox.baseVal; const from = {x:vb.x, y:vb.y, w:vb.width, h:vb.height};
  const cx = (p1.x + p2.x) / 2, cy = (p1.y + p2.y) / 2;
  const w = Math.max((p2.x - p1.x) * 1.3, (p2.y - p1.y) * 1.3 * from.w / from.h, 20), h = w * from.h / from.w;
  const to = {x:cx - w / 2, y:cy - h / 2, w, h};

function stkTrace(n, forever){

const GLOSSARY = [
  ["two's complement", "The standard way to store negative integers: flip every bit and add 1. It lets one adder handle both addition and subtraction."],
  ["transistor", "A tiny electrically controlled switch. A voltage on its gate turns it on or off. Chips are billions of these."],

  ["nMOS", "A transistor that turns ON when its gate is 1. Used to connect outputs to ground (0)."],
  ["VDD", "The power supply rail. Anything connected to it reads as 1."],
  ["GND", "Ground: the 0-volt rail. Anything connected to it reads as 0."],

  ["half adder", "Adds two bits. Gives a sum bit (XOR) and a carry bit (AND)."],

  ["latch", "A circuit that remembers a bit by feeding its outputs back into its inputs."],
  ["ALU", "Arithmetic logic unit: the part of a CPU core that adds, subtracts and does logic."],
  ["pipeline", "Splitting instruction processing into stages so several instructions are in progress at once, like an assembly line."],
  ["register", "A tiny, very fast storage slot inside the CPU core that holds a value being worked on."],
  ["cache line", "The fixed-size chunk (usually 64 bytes) that memory always moves in between RAM and the caches."],

  ["page table", "The OS's map from each virtual memory page to where it really lives in RAM (or on disk)."],

  ["lane", "One of the many simple arithmetic units in a GPU cluster, each working on its own piece of data."],

        const text = node.nodeValue, m = text.slice(pos).match(GL_RE); if (!m) break;
        const entry = GL_MAP.get(m[1].toLowerCase());

        if (!entry || used.has(entry[0])){ pos = start + m[0].length; continue; }
        used.add(entry[0]);

      <li><div><b>Zoom into a live chip</b> ${lvlTag("b")}<span class="note">From the whole chip down to one transistor, while it runs.</span></div><button class="btn" data-goto="zoom:cpu">Open Live chip</button></li>
      <li><div><b>If you write code</b> ${lvlTag("b")}<span class="note">Why 127 + 1 = −128, why 0.1 + 0.2 ≠ 0.3, and more.</span></div><button class="btn" data-goto="dev:0">For devs, lab 1</button></li>
      <li><div><b>Build your own chip</b> ${lvlTag("i")}<span class="note">Wire gates, test them, save them as reusable chips.</span></div><button class="btn" data-goto="build:">Open Build</button></li>
    </ol>
    <p class="note">Tags show how deep each part goes: ${lvlTag("b")} ${lvlTag("i")} ${lvlTag("d")}. <span style="border-bottom:1.5px dotted var(--accent)">Dotted words</span> have a short definition: hover or tap them.</p>`,
    [{label:"Explore on my own"}]);
}
function showAbout(){
  openModal("About Chip Lab", `
    <div class="aboutbrand"><svg width="40" height="40" viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="5" width="16" height="16" rx="4" fill="var(--accent)"/><path d="M9 1v4M13 1v4M17 1v4M9 21v4M13 21v4M17 21v4M1 9h4M1 13h4M1 17h4M21 9h4M21 13h4M21 17h4" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="13" r="3" fill="var(--signal)"/></svg>
      <div><b style="font-size:17px">Chip Lab</b><span class="note">An AP Tensor Lab project · version ${VERSION}</span></div></div>
    <p class="explain">An interactive lab for understanding how computers work, from transistors and logic gates up to CPUs, GPUs and AI chips, and how that hardware shows up in everyday code.</p>
    <dl class="pinlist">
      <dt>Created by</dt><dd>Arveend (AP Tensor Lab)</dd>
      <dt>Built with</dt><dd>Claude (Anthropic) as a coding partner</dd>
      <dt>Code</dt><dd><a href="https://github.com/aparve08" target="_blank" rel="noopener">github.com/aparve08</a></dd>
      <dt>Portfolio</dt><dd><a href="https://aparve08.github.io" target="_blank" rel="noopener">aparve08.github.io</a></dd>
      <dt>Licence</dt><dd>MIT</dd>
    </dl>
    <p class="note"><b>A teaching model, not a real chip.</b> Scales are shrunk (a 4×4 NPU, 32-lane GPU clusters), and figures such as transistor counts, clock speed and latencies are typical round numbers. Each screen points out where real hardware does more.</p>
    <p class="note">Your saved chips and progress stay in this browser only. Use Export / Import in Build to move them.</p>`,
    [{label:"Start here", onClick:() => { setTimeout(showStart, 0); }}, {label:"Close", primary:true}]);
}
$("#startBtn").addEventListener("click", showStart);
$("#aboutBtn").addEventListener("click", showAbout);

/* ---------- start ---------- */
restore();
app.dataset.mode = state.mode;
setMode(state.mode);
GL_ROOTS.forEach(s => glossify($(s)));
if (state.firstVisit) setTimeout(showStart, 300);
</script>
