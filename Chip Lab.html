<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip Lab</title>
<style>
:root{
  /* Layout: lesson list / parts palette  |  live circuit board  |  truth table + readout */
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFC; --ink:#1D1D1F; --muted:#6E6E73; --line:#DCDCE1;
  --accent:#0071E3; --accent-a:rgba(0,113,227,.12); --accent-ink:#0066CC;
  --signal:#FF9500; --signal-ink:#B45309; --signal-a:rgba(255,149,0,.16);
  --off:#C7C7CC; --led-off:#EEEEF2; --gate-fill:#FFFFFF; --gate-stroke:#3A3A3C; --chip-fill:#F2F2F7;
  --dot:#CFCFD6; --glass:rgba(250,250,252,.84); --seg:#E6E6EB; --danger:#D70015;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
  --low:#3D6FD9; --conduct:#248A3D; --conduct-a:rgba(52,199,89,.16);
  --si-p:#F1E2D3; --si-n:#DCE8F7; --oxide:#EDE6C8;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0B; --surface:#1C1C1E; --surface-2:#141416; --ink:#F5F5F7; --muted:#A1A1A6; --line:#2E2E32;
    --accent:#2997FF; --accent-a:rgba(41,151,255,.18); --accent-ink:#4DA8FF;
    --signal:#FFB340; --signal-ink:#FFC266; --signal-a:rgba(255,179,64,.16);
    --off:#4A4A4F; --led-off:#2C2C2E; --gate-fill:#2C2C2E; --gate-stroke:#D1D1D6; --chip-fill:#232326;
    --dot:#2F2F33; --glass:rgba(22,22,24,.82); --seg:#2C2C2E; --danger:#FF453A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --low:#6EA2FF; --conduct:#30D158; --conduct-a:rgba(48,209,88,.16);
    --si-p:#3B3029; --si-n:#243244; --oxide:#4A4532;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#1C1C1E; --surface-2:#141416; --ink:#F5F5F7; --muted:#A1A1A6; --line:#2E2E32;
  --accent:#2997FF; --accent-a:rgba(41,151,255,.18); --accent-ink:#4DA8FF;
  --signal:#FFB340; --signal-ink:#FFC266; --signal-a:rgba(255,179,64,.16);
  --off:#4A4A4F; --led-off:#2C2C2E; --gate-fill:#2C2C2E; --gate-stroke:#D1D1D6; --chip-fill:#232326;
  --dot:#2F2F33; --glass:rgba(22,22,24,.82); --seg:#2C2C2E; --danger:#FF453A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --low:#6EA2FF; --conduct:#30D158; --conduct-a:rgba(48,209,88,.16);
  --si-p:#3B3029; --si-n:#243244; --oxide:#4A4532;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-a);outline-offset:1px;box-shadow:0 0 0 1px var(--accent)}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:600 17px/1 var(--font-display);letter-spacing:-.01em;margin-right:6px}
.brand svg{flex:none}
.seg{display:inline-flex;background:var(--seg);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;font:500 13px/1 var(--font-body);padding:7px 18px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.spacer{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
[data-mode="learn"] .build-only{display:none!important}
[data-mode="build"] .learn-only{display:none!important}
[data-mode="zoom"] .build-only,[data-mode="zoom"] .learn-only,[data-mode="zoom"] #stage{display:none!important}
.zoom-only{display:none!important}
[data-mode="zoom"] .zoom-only{display:flex!important}
[data-mode="dev"] .build-only,[data-mode="dev"] .learn-only,[data-mode="dev"] #stage{display:none!important}
.dev-only{display:none!important}
[data-mode="dev"] .dev-only{display:flex!important}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);font:500 13px/1 var(--font-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-ink)}

.main{display:grid;grid-template-columns:264px minmax(0,1fr) 304px;min-height:0}
aside{overflow:auto;padding:18px 16px;background:var(--surface-2)}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{position:relative;flex:1;min-height:0;background:var(--bg)}
#board{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

h2.sec{font:600 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.sec + .sec{margin-top:22px}
section.block{display:flex;flex-direction:column;gap:10px}
section.block + section.block{margin-top:24px}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--danger);margin:0;min-height:1em}

/* lessons */
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lessons button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;
  border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer}
.lessons button:hover{background:var(--seg)}
.lessons button[aria-current="true"]{background:var(--accent-a)}
.lessons .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--seg);
  font:600 12px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.lessons [aria-current="true"] .num{background:var(--accent);color:#fff}
.lessons .t{font:600 14px/1.25 var(--font-body);display:block}
.lessons .s{font-size:12px;color:var(--muted);display:block}

.lesson-card{padding:20px 24px 16px;border-bottom:1px solid var(--line);background:var(--surface);overflow:auto;max-height:46%}
.eyebrow{font:600 12px/1 var(--font-body);color:var(--accent-ink);margin:0 0 8px}
.lesson-card h1{font:700 26px/1.15 var(--font-display);letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.lesson-card p{max-width:65ch;margin:0 0 8px;color:var(--ink)}
.try{display:flex;gap:10px;align-items:baseline;max-width:65ch;margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-a)}
.try b{font:600 12px/1 var(--font-body);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;flex:none}
.lesson-nav{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* palette */
.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);cursor:grab;text-align:center}
.part:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.part .nm{font:600 12px/1.2 var(--font-body)}
.part .tc{font:500 10px/1 var(--font-mono);color:var(--muted)}
.part.wide{grid-column:span 2;flex-direction:row;justify-content:flex-start;gap:10px;padding:8px 10px;text-align:left}
.part.wide .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.part .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:transparent;
  color:var(--muted);cursor:pointer;opacity:0;font:16px/1 var(--font-body)}
.part:hover .x,.part .x:focus-visible{opacity:1}
.part .x:hover{background:var(--seg);color:var(--danger)}
.empty-chips{font-size:13px;color:var(--muted);grid-column:span 2;margin:0;padding:10px;border:1px dashed var(--line);border-radius:12px}

/* svg */
.bg{fill:url(#dots)}
.gate path,.gate circle{fill:var(--gate-fill);stroke:var(--gate-stroke);stroke-width:1.6;stroke-linejoin:round}
.gate .xb{fill:none}
.stub{stroke:var(--off);stroke-width:2.5;stroke-linecap:round}
.stub.on{stroke:var(--signal)}
.wire .line{fill:none;stroke:var(--off);stroke-width:2.5;stroke-linecap:round}
.wire.on .line{stroke:var(--signal)}
.wire .hit{fill:none;stroke:transparent;stroke-width:14}
.editable .wire .hit{cursor:pointer}
.wire.sel .line{stroke:var(--accent);stroke-dasharray:7 5}
.pin{fill:var(--surface);stroke:var(--off);stroke-width:2}
.pin.on{fill:var(--signal);stroke:var(--signal)}
.pin-hit{fill:transparent;cursor:crosshair}
.pin-hit:hover{fill:var(--accent-a);stroke:var(--accent);stroke-width:1.5}
.cap{font:600 9.5px var(--font-mono);fill:var(--muted);letter-spacing:.08em}
.lbl{font:600 12.5px var(--font-body);fill:var(--ink)}
.sw-track{fill:var(--off);transition:fill .15s}
.node.on .sw-track{fill:var(--signal)}
.knob{fill:#fff;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3));transition:cx .15s}
.clk-body{fill:var(--gate-fill);stroke:var(--gate-stroke);stroke-width:1.6}
.node.on .clk-body{fill:var(--signal-a);stroke:var(--signal)}
.clk-wave{fill:none;stroke:var(--gate-stroke);stroke-width:1.6}
.led{fill:var(--led-off);stroke:var(--gate-stroke);stroke-width:1.4}
.led.on{fill:var(--signal);stroke:var(--signal);filter:url(#glow)}
.led-v{font:700 11px var(--font-mono);fill:var(--muted)}
.led.on + .led-v{fill:#3a2200}
.hex-body{fill:#1A1D24;stroke:var(--gate-stroke);stroke-width:1.4}
.sg-on{fill:var(--signal)}
.sg-off{fill:#3A3F4B}
.hex-pin{font:600 9px var(--font-mono);fill:#9AA4B8}
.chip-body{fill:var(--chip-fill);stroke:var(--gate-stroke);stroke-width:1.6}
.chip-body.missing{stroke:var(--danger);stroke-dasharray:5 4}
.chip-name{font:700 11px var(--font-display);fill:var(--ink);letter-spacing:.05em}
.chip-pin{font:500 10px var(--font-mono);fill:var(--muted)}
.sel-box{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.editable .node{cursor:grab}
.node.t-IN{cursor:pointer}
.temp-wire{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-dasharray:6 5;pointer-events:none}

.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);
  border-radius:10px;padding:3px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.zoom button{border:0;background:transparent;width:32px;height:28px;border-radius:7px;cursor:pointer;font:500 15px/1 var(--font-body)}
.zoom button.txt{width:auto;padding:0 10px;font-size:12px}
.zoom button:hover{background:var(--seg)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;font-size:14px;max-width:280px}
.status{position:absolute;left:14px;bottom:14px;font:500 12px/1 var(--font-mono);color:var(--muted);background:var(--glass);
  padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.status.warn{color:var(--danger)}

/* right panel */
.readout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.ro-eq{font:600 20px/1.3 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
.ro-eq .op{color:var(--muted)}
.ro-eq .hl{color:var(--signal-ink)}
.ro-dec{font:600 15px/1.3 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.tt-wrap{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tt{border-collapse:collapse;width:100%;font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.tt th{position:sticky;top:0;background:var(--surface);font:600 11px/1.2 var(--font-body);color:var(--muted);text-align:center;
  padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tt td{text-align:center;padding:7px 6px;border-bottom:1px solid var(--line)}
.tt tr:last-child td{border-bottom:0}
.tt .sep{border-left:1px solid var(--line)}
.tt td.one{color:var(--signal-ink);font-weight:700}
.tt td.zero{color:var(--muted)}
.tt tr.cur td{background:var(--accent-a)}
.stats{font:500 12px/1.5 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.help{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.keys{font-size:12.5px;color:var(--muted);margin:0}
kbd{font:500 11px/1 var(--font-mono);padding:2px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface)}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.insp h3{margin:0;font:600 16px/1.2 var(--font-display)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
input[type="text"],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
textarea{font:12px/1.45 var(--font-mono);resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-a)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.open{display:flex}
.sheet{width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:700 19px/1.2 var(--font-display);letter-spacing:-.01em}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pinlist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.pinlist dt{color:var(--muted);font-weight:600}
.pinlist dd{margin:0;font-family:var(--font-mono)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);
  transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* on-ramps */
.brand-t{display:flex;flex-direction:column;gap:2px}
.byline{font:500 11px/1 var(--font-body);color:var(--muted);letter-spacing:.01em}
.lvl{display:inline-block;font:600 9.5px/1 var(--font-body);letter-spacing:.04em;padding:3px 6px;border-radius:6px;vertical-align:1px;margin-left:2px;white-space:nowrap}
.lvl-b{background:var(--conduct-a);color:var(--conduct)}
.lvl-i{background:var(--signal-a);color:var(--signal-ink)}
.lvl-d{background:var(--accent-a);color:var(--accent-ink)}
.gl{border-bottom:1.5px dotted var(--accent);cursor:help}
.gl:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
#glpop{position:fixed;z-index:40;display:none;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.45;box-shadow:var(--shadow);pointer-events:none}
#glpop.show{display:flex}
#glpop b{font-size:13.5px;text-transform:capitalize}
.startpath{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.startpath li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.startpath li > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.startpath li > div > .lvl{align-self:flex-start;margin-left:0}
.startpath .btn{flex:none}
.aboutbrand{display:flex;gap:12px;align-items:center}
.aboutbrand > div{display:flex;flex-direction:column;gap:2px}
.pinlist a{color:var(--accent-ink)}
@media (max-width:560px){ .startpath li{flex-direction:column;align-items:flex-start} .byline{display:none} }

/* for devs */
.dstage{flex:1;min-height:0;overflow:auto;background:var(--bg);flex-direction:column}
.dwrap{width:100%;max-width:940px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.dtitle{font:700 28px/1.15 var(--font-display);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.dintro{max-width:65ch;margin:0;color:var(--muted);font-size:15.5px}
pre.code{margin:0;font:13px/1.65 var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;overflow-x:auto;white-space:pre}
.code .cm{color:var(--muted)}
.code .kw{color:var(--accent-ink);font-weight:600}
.code .hlrow{background:var(--accent-a);border-radius:4px;box-shadow:-6px 0 0 var(--accent-a),6px 0 0 var(--accent-a)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dcard h3{margin:0;font:600 16px/1.2 var(--font-display)}
.bitrow{display:flex;gap:8px;flex-wrap:wrap}
.bitbtn{display:flex;flex-direction:column;align-items:center;gap:4px}
.bitbtn .w{font:500 10px/1 var(--font-mono);color:var(--muted);white-space:nowrap}
.bitbtn button{width:46px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:700 20px/1 var(--font-mono);cursor:pointer;color:var(--muted)}
.bitbtn button.on{background:var(--signal);border-color:var(--signal);color:#3a2200}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dnum{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dnum .k{font:600 11px/1.2 var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dnum b{font:700 24px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.fbits{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.fbit{width:18px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font:700 12px/1 var(--font-mono);cursor:pointer;color:var(--muted);padding:0}
.fbit.fs{border-bottom:3px solid var(--danger)} .fbit.fe{border-bottom:3px solid var(--accent)} .fbit.fm{border-bottom:3px solid var(--signal)}
.fbit.on.fs{background:var(--danger);color:#fff} .fbit.on.fe{background:var(--accent);color:#fff} .fbit.on.fm{background:var(--signal);color:#3a2200}
.fgap{width:8px}
.flegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.flegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.sw.fs{background:var(--danger)} .sw.fe{background:var(--accent)} .sw.fm{background:var(--signal)}
.bwgrid{display:flex;flex-direction:column;gap:8px;overflow-x:auto}
.bwrow{display:flex;gap:6px;align-items:center}
.bwl{width:60px;font:600 13px var(--font-body);color:var(--muted)}
.bwb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font:700 16px/1 var(--font-mono);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.bwb.on{background:var(--signal);border-color:var(--signal);color:#3a2200}
.bwb.res{cursor:default;border-style:dashed}
.bwb.res.on{background:var(--conduct);border-color:var(--conduct);color:#fff;border-style:solid}
.bwv{font:600 14px var(--font-mono);color:var(--muted);margin-left:8px;white-space:nowrap}
.bwop{font:700 16px var(--font-mono);color:var(--muted);padding-left:66px}
.memwrap{display:flex;gap:20px;flex-wrap:wrap}
.memgrid{display:grid;grid-template-columns:repeat(8,44px);gap:4px}
.mc{height:34px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font:500 10px var(--font-mono);color:var(--muted);background:var(--surface)}
.mc.incache{box-shadow:inset 0 0 0 2px var(--accent-a);border-color:var(--accent)}
.mc.hit{background:var(--conduct-a);border-color:var(--conduct);color:var(--ink)}
.mc.miss{background:var(--signal-a);border-color:var(--signal);color:var(--ink)}
.mc.cur{outline:3px solid var(--accent);outline-offset:1px}
.memside{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.cl{font:500 12px var(--font-mono);padding:7px 10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-a)}
.cl.empty{border:1px dashed var(--line);background:transparent;color:var(--muted)}
.cl.now{background:var(--accent);color:#fff}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:13px}
.barbg{height:10px;border-radius:5px;background:var(--seg)}
.bar{height:10px;border-radius:5px;background:var(--conduct)}
.bar.warn{background:var(--signal)}
.strip{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.sc{border-radius:7px;border:1px solid var(--line);padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 10.5px/1.1 var(--font-mono);color:var(--muted)}
.sc b{color:var(--ink);font-size:11px}
.sc.ok{background:var(--conduct-a);border-color:var(--conduct)}
.sc.bad{background:var(--signal-a);border-color:var(--signal)}
.cores{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.core{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.instr{font:500 13px var(--font-mono);padding:7px 10px;border-radius:8px;border:1px solid transparent}
.instr.done{color:var(--muted);text-decoration:line-through}
.instr.next{background:var(--accent-a);border-color:var(--accent)}
.memcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border-radius:14px;border:2px solid var(--signal);background:var(--signal-a);text-align:center}
.memcell .k{font:600 11px var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.memcell b{font:700 22px var(--font-mono)}
.banner{padding:12px 16px;border-radius:12px;font-weight:600}
.banner.good{background:var(--conduct-a);color:var(--conduct)}
.banner.bad{background:var(--signal-a);color:var(--signal-ink)}
.rclog{font:12.5px/1.7 var(--font-mono);background:var(--surface-2);border-radius:10px;padding:10px 14px;max-height:180px;overflow:auto}
/* dev labs 7-11 */
.sfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.sfield{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);border-left-width:5px}
.sfield code{font:600 14px var(--font-mono)}
.sfield .btn{height:26px;padding:0 9px}
.f-a{border-left-color:var(--accent)} .f-b{border-left-color:var(--signal)} .f-c{border-left-color:var(--conduct)} .f-d{border-left-color:var(--low)}
.bstrip{display:flex;gap:4px;flex-wrap:wrap}
.bcell{width:52px;height:64px;border-radius:9px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bcell b{font:700 15px var(--font-mono)}
.bcell .bo{font:500 9.5px var(--font-mono);color:var(--muted)}
.bcell .bf{font:600 10px var(--font-mono);color:var(--muted)}
.bcell.f-a{background:var(--accent-a);border-color:var(--accent)} .bcell.f-b{background:var(--signal-a);border-color:var(--signal)}
.bcell.f-c{background:var(--conduct-a);border-color:var(--conduct)} .bcell.f-d{background:color-mix(in srgb,var(--low) 16%,transparent);border-color:var(--low)}
.bcell.pad{background:repeating-linear-gradient(45deg,var(--surface-2) 0 5px,var(--seg) 5px 10px);color:var(--muted)}
.bcell.pad b{font-size:11px;font-weight:600;color:var(--muted)}
.stkwrap{display:flex;gap:20px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:4px;width:min(360px,100%)}
.sframe{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:7px 12px;border-radius:9px;border:1px solid var(--accent);background:var(--accent-a);font-size:13px}
.sframe b{font:600 13px var(--font-mono)}
.sframe .note{grid-column:2;font-size:11.5px}
.sframe .sa{grid-row:span 2;font:500 10px var(--font-mono);color:var(--muted)}
.sframe.top{background:var(--accent);color:#fff;border-color:var(--accent)} .sframe.top .note,.sframe.top .sa{color:rgba(255,255,255,.8)}
.sframe.empty{background:transparent;border:1px dashed var(--line)}
.sframe.over{background:var(--signal-a);border:2px dashed var(--danger);grid-template-columns:1fr}
.sframe.over .note{grid-column:1}
.sp{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:700 12px var(--font-mono);color:#fff}
.vaddr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vpart{font:600 14px var(--font-mono);padding:8px 12px;border-radius:9px}
.vpart.vpn{background:var(--accent-a);color:var(--accent-ink)} .vpart.off{background:var(--seg)} .vpart.phys{background:var(--conduct-a);color:var(--conduct)} .vpart.bad{background:var(--signal-a);color:var(--danger)}
.varrow{color:var(--muted);font-size:18px}
.vmgrid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px}
.vmgrid > div{display:flex;flex-direction:column;gap:5px}
.ptable{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.ptr{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--font-mono);padding:3px 6px;border-radius:6px}
.ptr.now{background:var(--accent-a);outline:1.5px solid var(--accent)}
.pill{font:600 10.5px var(--font-body);padding:2px 7px;border-radius:10px}
.pill.mem{background:var(--conduct-a);color:var(--conduct)} .pill.disk{background:var(--signal-a);color:var(--signal-ink)} .pill.none{background:var(--seg);color:var(--muted)}
.pframes{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pframe{display:flex;flex-direction:column;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.pframe b{font:600 12px var(--font-mono)}
.pframe.free b{color:var(--muted);font-weight:500}
.pframe.now{border-color:var(--conduct);background:var(--conduct-a)}
.sgrid{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.srow{display:flex;gap:4px;align-items:center}
.scell{width:36px;height:36px;flex:none;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font:600 14px var(--font-mono);background:var(--surface-2)}
.scell.alt{background:var(--seg)}
.scell.empty{color:var(--muted);border-style:dashed}
.scell.done{background:var(--conduct-a);border-color:var(--conduct)}
.scell.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.kvt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
.kvt .k{font:600 12px var(--font-body);color:var(--muted);white-space:nowrap}
.kvt code{font:600 15px var(--font-mono);word-break:break-all;background:var(--surface-2);padding:6px 10px;border-radius:8px}
@media (max-width:900px){ .vmgrid{grid-template-columns:1fr} .sp{display:none} }
@media (max-width:700px){ .strip{grid-template-columns:repeat(8,minmax(0,1fr))} .cores{grid-template-columns:1fr} .memgrid{grid-template-columns:repeat(8,minmax(0,1fr))} }

/* live chip (zoom) */
.zstage{flex:1;min-height:0;flex-direction:column;background:var(--bg);position:relative}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumbs button{border:0;background:transparent;padding:5px 9px;border-radius:7px;font:500 13px/1 var(--font-body);color:var(--accent-ink);cursor:pointer}
.crumbs button:hover{background:var(--seg)}
.crumbs button[aria-current="true"]{color:var(--ink);font-weight:600;cursor:default;background:transparent}
.crumbs .sepc{color:var(--muted);font-size:12px}
.zwrap{flex:1;min-height:0;display:flex;padding:14px}
#zsvg{width:100%;height:100%;display:block;transition:opacity .2s}
#zsvg.fade{opacity:0}
.zhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:13px;color:var(--ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow);
  pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:relative}
.ladder button{width:100%;display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer}
.ladder button:hover{background:var(--seg)}
.ladder button[aria-current="true"]{background:var(--accent-a)}
.ladder .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--off);background:var(--surface)}
.ladder [aria-current="true"] .dot{border-color:var(--accent);background:var(--accent)}
.ladder .t{font:600 14px/1.25 var(--font-body);display:block}
.ladder .s{font:500 11.5px/1.35 var(--font-mono);color:var(--muted);display:block;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg.small button{padding:6px 10px;font-size:12px}
.bignum{font:700 30px/1.1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bits{font:600 14px/1.4 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bits b{color:var(--signal-ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* die */
.die{fill:#1A1D24}
.pad{fill:#B8925A}
.blk{fill:#232833;stroke:#3A4253;stroke-width:1.2}
.blk.hotb{stroke:var(--accent);stroke-width:2.5}
.blk-lbl{font:700 10px var(--font-mono);fill:#9AA4B8;letter-spacing:.12em}
.blk-lbl.big{font-size:13px}
.cell{fill:#363E4E}
.act{animation:act var(--d,1s) steps(1,end) infinite;animation-delay:var(--dl,0s)}
.act.hot{animation-name:acthot}
@keyframes act{0%{fill:#363E4E}50%{fill:#5B6E92}}
@keyframes acthot{0%{fill:#3A4458}50%{fill:#FFB340}}
.paused .act,.paused .e{animation-play-state:paused}
.ztarget{cursor:zoom-in}
.ztarget:hover .blk{stroke:var(--accent);stroke-width:3}
.ring{fill:none;stroke:var(--accent);stroke-width:2;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.9}100%{opacity:.15}}
/* core */
.st{fill:var(--surface);stroke:var(--line);stroke-width:1.4}
.st.act2{fill:var(--accent-a);stroke:var(--accent)}
.st.idle{fill:var(--surface-2);stroke:var(--line);stroke-dasharray:4 4}
.st-t{font:600 13px var(--font-body);fill:var(--ink)}
.st-s{font:500 11.5px var(--font-mono);fill:var(--muted)}
.st-s.hl{fill:var(--signal-ink);font-weight:700}
.arrow{stroke:var(--muted);stroke-width:1.6;fill:none;marker-end:url(#arr)}
.pulse{animation:pulse .5s ease-out}
@keyframes pulse{from{stroke-width:5}to{stroke-width:1.4}}
/* adder */
.fa{fill:var(--chip-fill);stroke:var(--gate-stroke);stroke-width:1.5}
.fa.sel{stroke:var(--accent);stroke-width:3}
.bitc{stroke:var(--gate-stroke);stroke-width:1.2}
.bitc.hi{fill:var(--signal)}
.bitc.lo{fill:var(--led-off)}
.bitc.pend{fill:var(--surface);stroke-dasharray:3 3}
.bt{font:700 12px var(--font-mono);text-anchor:middle}
.rowlbl{font:600 12px var(--font-body);fill:var(--muted)}
.carry{fill:none;stroke-width:3;stroke-linecap:round}
.carry.hi{stroke:var(--signal)}
.carry.lo{stroke:var(--off)}
/* transistor cross-section */
.sub-p{fill:var(--si-p)} .sub-n{fill:var(--si-n)}
.well-n{fill:var(--si-n);stroke:var(--low);stroke-width:1.2} .well-p{fill:var(--si-p);stroke:var(--signal-ink);stroke-width:1.2}
.oxide{fill:var(--oxide);stroke:var(--gate-stroke);stroke-width:.8}
.metal{stroke:var(--gate-stroke);stroke-width:1.4}
.metal.hi{fill:var(--signal)} .metal.lo{fill:var(--low)}
.chanl{fill:var(--conduct-a);stroke:var(--conduct);stroke-width:1.2}
.e{fill:var(--low)} .h{fill:none;stroke:var(--signal-ink);stroke-width:2}
.e.flow,.h.flow{animation:flow 2.2s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(178px)}}
.xs-lbl{font:600 12px var(--font-body);fill:var(--ink)}
.xs-sub{font:500 11px var(--font-mono);fill:var(--muted)}
.field{stroke:var(--conduct);stroke-width:1.6;marker-end:url(#arr2)}
.ztr{cursor:zoom-in}
.ztr:hover{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
@media (prefers-reduced-motion:reduce){ .act,.ring,.e.flow,.h.flow,.pulse{animation:none} }

/* transistor view */
.tv-scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);display:flex;align-items:center;justify-content:center;padding:16px;z-index:25}
.tv-scrim[hidden]{display:none}
.tv-sheet{width:min(1180px,100%);height:min(760px,100%);background:var(--surface);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.35);
  display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tv-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.tv-head h2{margin:0;font:700 19px/1.2 var(--font-display);letter-spacing:-.01em}
.tv-head .seg button:disabled{opacity:.4;cursor:default}
.tv-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.tv-canvas{min-height:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:12px}
#tvSvg{width:100%;height:100%;max-height:100%}
.tv-side{border-left:1px solid var(--line);overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px;background:var(--surface-2)}
.tv-io{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);
  font:600 14px/1 var(--font-mono);cursor:pointer}
.pill .b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--low);color:#fff;font-size:12px}
.pill.on .b{background:var(--signal);color:#3a2200}
.tv-out{font:700 22px/1 var(--font-mono);display:flex;align-items:center;gap:10px}
.tv-out .dot{width:22px;height:22px;border-radius:50%;background:var(--led-off);border:1.5px solid var(--gate-stroke)}
.tv-out .dot.on{background:var(--signal);border-color:var(--signal);box-shadow:0 0 14px var(--signal)}
.explain{font-size:14px;line-height:1.55;margin:0}
.explain b{font-weight:600}
.legend{display:grid;grid-template-columns:28px 1fr;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend svg{display:block}
.insight{font-size:13px;line-height:1.5;padding:12px 14px;border-radius:12px;background:var(--conduct-a);margin:0}
.net{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.net.hi{stroke:var(--signal)}
.net.lo{stroke:var(--low)}
.net.fl{stroke:var(--off);stroke-dasharray:3 6}
.net.rail{stroke-width:6}
.glow{fill:none;stroke:var(--conduct-a);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.tr-bg{fill:transparent;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.tr-bg.on{fill:var(--conduct-a);stroke:var(--conduct);stroke-dasharray:none}
.chan{stroke:var(--off);stroke-width:4;stroke-dasharray:4 5;stroke-linecap:round}
.chan.on{stroke:var(--conduct);stroke-dasharray:none}
.plate{stroke:var(--gate-stroke);stroke-width:3;stroke-linecap:round}
.bubble{fill:var(--surface);stroke:var(--gate-stroke);stroke-width:2}
.tr-name{font:600 11px var(--font-mono);fill:var(--muted)}
.tr-st{font:700 11px var(--font-mono);fill:var(--muted);letter-spacing:.06em}
.tr-st.on{fill:var(--conduct)}
.tv-in{cursor:pointer}
.in-dot{stroke:var(--surface);stroke-width:2}
.in-dot.hi{fill:var(--signal)}
.in-dot.lo{fill:var(--low)}
.in-lbl{font:700 15px var(--font-mono);fill:var(--ink)}
.rail-lbl{font:700 12px var(--font-mono);fill:var(--muted);letter-spacing:.04em}
.net-lbl{font:600 11px var(--font-mono);fill:var(--muted)}
.stage-lbl{font:600 11px var(--font-body);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.node.peek{cursor:zoom-in}
.node.peek:hover .gate path,.node.peek:hover .gate circle{stroke:var(--accent)}

@media (max-width:960px){
  .tv-sheet{height:auto;max-height:100%;overflow:auto}
  .tv-body{grid-template-columns:1fr}
  .tv-canvas{height:56vh}
  .tv-side{border-left:0;border-top:1px solid var(--line)}
  .zstage{min-height:72vh}
  .dstage{overflow:visible}
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  aside.left{border-right:0;border-bottom:1px solid var(--line);max-height:260px}
  aside.right{border-left:0;border-top:1px solid var(--line)}
  .stage{height:62vh;flex:none}
  .lesson-card{max-height:none}
  [data-mode="learn"] aside.left{max-height:none;padding:12px 16px}
  [data-mode="learn"] .lessons{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  [data-mode="learn"] .lessons button{grid-template-columns:26px auto;white-space:nowrap}
  [data-mode="learn"] .lessons .s{display:none}
  .palette{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .part.wide{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

<body>
<div class="app" id="app" data-mode="learn">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="5" width="16" height="16" rx="4" fill="var(--accent)"/><path d="M9 1v4M13 1v4M17 1v4M9 21v4M13 21v4M17 21v4M1 9h4M1 13h4M1 17h4M21 9h4M21 13h4M21 17h4" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="13" r="3" fill="var(--signal)"/></svg>
      <span class="brand-t">Chip Lab<span class="byline">by AP Tensor Lab</span></span>
    </div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="modeLearn" aria-pressed="true">Learn</button>
      <button id="modeBuild" aria-pressed="false">Build</button>
      <button id="modeZoom" aria-pressed="false">Live chip</button>
      <button id="modeDev" aria-pressed="false">For devs</button>
    </div>
    <div class="spacer"></div>
    <button class="btn quiet" id="startBtn">Start here</button>
    <button class="btn quiet" id="aboutBtn">About</button>
    <button class="btn" id="tvBtn" title="See the CMOS transistors inside a gate">Transistor view</button>
    <div class="actions build-only">
      <button class="btn" id="undoBtn" title="Undo (Ctrl/⌘ Z)">Undo</button>
      <button class="btn" id="redoBtn" title="Redo (Ctrl/⌘ Shift Z)">Redo</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn" id="shareBtn">Export / Import</button>
      <button class="btn primary" id="saveChipBtn">Save as chip</button>
    </div>
  </header>

  <div class="main">
    <aside class="left" id="left"></aside>

      <div class="stage" id="stage">
        <svg id="board" aria-label="Circuit board">
          <defs>
            <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" fill="var(--dot)"/></pattern>
            <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect class="bg" x="-20000" y="-20000" width="40000" height="40000"/>
          <g id="layer"></g>
          <path id="temp" class="temp-wire" d=""/>
        </svg>
        <div class="hint build-only" id="emptyHint" hidden>Drag a part from the left onto the board, or tap a part to add it.</div>
        <div class="status" id="status" hidden></div>
        <div class="zoom">
          <button id="zoomOut" aria-label="Zoom out">−</button>
          <button id="zoomIn" aria-label="Zoom in">+</button>
          <button id="zoomFit" class="txt">Fit</button>
        </div>
      </div>
      <div class="dstage dev-only" id="dstage"></div>
      <div class="zstage zoom-only" id="zstage">
        <nav class="crumbs" id="crumbs" aria-label="Zoom level"></nav>
        <div class="zwrap"><svg id="zsvg" aria-label="Live chip" preserveAspectRatio="xMidYMid meet"></svg></div>

</div>

<div class="tv-scrim" id="tv" hidden>
  <div class="tv-sheet" role="dialog" aria-modal="true" aria-labelledby="tvTitle">
    <div class="tv-head">
      <h2 id="tvTitle">Inside the gate</h2>
      <div class="seg" role="group" aria-label="Gate" id="tvSeg"></div>
      <div class="spacer"></div>
      <button class="btn" id="tvClose">Close</button>
    </div>

      <div class="tv-canvas"><svg id="tvSvg" aria-label="Transistor schematic" preserveAspectRatio="xMidYMid meet"></svg></div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let uidN = 0;
const nid = p => (p || "n") + Date.now().toString(36).slice(-5) + (uidN++).toString(36);
const clone = o => JSON.parse(JSON.stringify(o));
const snap = v => Math.round(v / 10) * 10;
const KEY = "chiplab.v1";

/* ---------- parts ---------- */
const GATES = {
  NOT:  {n:1, t:2, f:a => [a[0] ? 0 : 1], d:"Flips the bit."},
  AND:  {n:2, t:6, f:a => [a[0] & a[1]], d:"1 only if both are 1."},
  OR:   {n:2, t:6, f:a => [a[0] | a[1]], d:"1 if either is 1."},
  NAND: {n:2, t:4, f:a => [(a[0] & a[1]) ? 0 : 1], d:"NOT of AND. Universal."},
  NOR:  {n:2, t:4, f:a => [(a[0] | a[1]) ? 0 : 1], d:"NOT of OR. Universal."},
  XOR:  {n:2, t:12, f:a => [a[0] ^ a[1]], d:"1 if they differ."},
  XNOR: {n:2, t:12, f:a => [(a[0] ^ a[1]) ? 0 : 1], d:"1 if they match."}
};
const IO_TYPES = ["IN", "OUT", "CLOCK", "CHIP", "HEX"];
const SEG7 = ["abcdef","bc","abdeg","abcdg","bcfg","acdfg","acdefg","abc","abcdefg","abcdfg","abcefg","cdefg","adef","bcdeg","adefg","aefg"];
const lib = new Map(); // name -> {name, circuit, builtin, io:{ins,outs}, transistors}

function ioOrder(c){
  const by = (a, b) => (a.y - b.y) || (a.x - b.x);
  return { ins: c.nodes.filter(n => n.type === "IN").sort(by), outs: c.nodes.filter(n => n.type === "OUT").sort(by) };
}
function ioOf(c){
  const {ins, outs} = ioOrder(c);
  return { ins: ins.map((n, i) => n.label || ("in" + (i + 1))), outs: outs.map((n, i) => n.label || ("out" + (i + 1))) };
}
function tCount(c){
  let t = 0;
  for (const n of c.nodes){
    if (GATES[n.type]) t += GATES[n.type].t;
    else if (n.type === "CHIP"){ const d = lib.get(n.chip); if (d) t += d.transistors; }
  }
  return t;
}
function gateCount(c){
  let g = 0;
  for (const n of c.nodes){
    if (GATES[n.type]) g++;
    else if (n.type === "CHIP"){ const d = lib.get(n.chip); if (d) g += gateCount(d.circuit); }
  }
  return g;
}
function defineChip(name, circuit, builtin){
  const d = { name, circuit, builtin: !!builtin };
  d.io = ioOf(circuit); d.transistors = tCount(circuit);
  lib.set(name, d); return d;
}
function usesChip(c, name, depth){
  depth = depth || 0; if (depth > 20) return true;
  return c.nodes.some(n => n.type === "CHIP" && (n.chip === name || (lib.get(n.chip) && usesChip(lib.get(n.chip).circuit, name, depth + 1))));
}
function nIns(n){
  if (n.type === "IN" || n.type === "CLOCK") return 0;
  if (n.type === "OUT") return 1;
  if (n.type === "HEX") return 4;
  if (n.type === "CHIP"){ const d = lib.get(n.chip); return d ? d.io.ins.length : 0; }
  return GATES[n.type] ? GATES[n.type].n : 0;
}
function nOuts(n){
  if (n.type === "IN" || n.type === "CLOCK") return 1;
  if (n.type === "OUT" || n.type === "HEX") return 0;
  if (n.type === "CHIP"){ const d = lib.get(n.chip); return d ? d.io.outs.length : 0; }
  return 1;
}
function chipWidth(name, io){
  const longest = Math.max(0, ...io.ins.map(s => s.length)) + Math.max(0, ...io.outs.map(s => s.length));
  return Math.max(100, name.length * 8 + 34, longest * 6.4 + 46);
}
function geom(n){
  switch (n.type){
    case "IN": case "CLOCK": return { w:52, h:32, ins:[], outs:[{x:52, y:16}] };
    case "OUT": return { w:40, h:32, ins:[{x:0, y:16}], outs:[] };
    case "HEX": return { w:80, h:96, ins:[16, 36, 56, 76].map((y, i) => ({x:0, y, label:String(1 << i)})), outs:[] };
    case "NOT": return { w:60, h:40, ins:[{x:0, y:20}], outs:[{x:60, y:20}] };
    case "CHIP": {
      const d = lib.get(n.chip); const io = d ? d.io : {ins:[], outs:[]};
      const k = Math.max(io.ins.length, io.outs.length, 1);
      const w = chipWidth(n.chip || "?", io);
      return { w, h: 28 + k * 20,
        ins: io.ins.map((l, i) => ({x:0, y:32 + i * 20, label:l})),
        outs: io.outs.map((l, i) => ({x:w, y:32 + i * 20, label:l})) };
    }
    default: return { w:70, h:40, ins:[{x:0, y:10}, {x:0, y:30}], outs:[{x:70, y:20}] };
  }
}

/* ---------- simulator ---------- */
class Sim {
  constructor(c, depth, prev){
    this.c = c; this.depth = depth || 0;
    this.byId = new Map(c.nodes.map(n => [n.id, n]));
    this.drv = new Map();
    for (const w of c.wires){
      if (!this.byId.has(w.from[0]) || !this.byId.has(w.to[0])) continue;
      let a = this.drv.get(w.to[0]); if (!a){ a = []; this.drv.set(w.to[0], a); }
      a[w.to[1]] = w.from;
    }
    this.out = new Map(); this.sub = new Map(); this.ov = new Map();
    for (const n of c.nodes){
      const k = nOuts(n);
      const p = prev && prev.out.get(n.id);
      this.out.set(n.id, p && p.length === k ? p.slice() : new Array(k).fill(0));
      if (n.type === "CHIP"){
        const d = lib.get(n.chip);
        if (d && this.depth < 16) this.sub.set(n.id, new Sim(d.circuit, this.depth + 1, prev && prev.sub.get(n.id)));
      }
    }
    // topological order; nodes caught in feedback loops keep their list order
    const indeg = new Map(c.nodes.map(n => [n.id, 0])); const succ = new Map(c.nodes.map(n => [n.id, []]));
    for (const [to, arr] of this.drv) for (const f of arr) if (f){ indeg.set(to, indeg.get(to) + 1); succ.get(f[0]).push(to); }
    const q = c.nodes.filter(n => indeg.get(n.id) === 0).map(n => n.id); const order = []; const seen = new Set();
    while (q.length){ const id = q.shift(); if (seen.has(id)) continue; seen.add(id); order.push(this.byId.get(id));
      for (const s of succ.get(id)){ indeg.set(s, indeg.get(s) - 1); if (indeg.get(s) === 0) q.push(s); } }
    const rest = c.nodes.filter(n => !seen.has(n.id));
    this.order = order.concat(rest);
    this.memory = rest.length > 0 || [...this.sub.values()].some(s => s.memory);
    const io = ioOrder(c); this.ins = io.ins; this.outs = io.outs;
    this.stable = true;
  }
  inv(n, i){
    const d = this.drv.get(n.id); const s = d && d[i]; if (!s) return 0;
    const o = this.out.get(s[0]); return o ? (o[s[1]] | 0) : 0;
  }
  evalNode(n){
    switch (n.type){
      case "IN": return [this.ov.has(n.id) ? this.ov.get(n.id) : (n.value | 0)];
      case "CLOCK": return [n.value | 0];
      case "OUT": case "HEX": return [];
      case "CHIP": {
        const s = this.sub.get(n.id); if (!s) return new Array(nOuts(n)).fill(0);
        const a = []; for (let i = 0; i < s.ins.length; i++) a.push(this.inv(n, i));
        s.setInputs(a); s.settle(); return s.readOutputs();
      }
      default: {
        const g = GATES[n.type]; if (!g) return [0];
        const a = []; for (let i = 0; i < g.n; i++) a.push(this.inv(n, i));
        return g.f(a);
      }
    }
  }
  settle(){
    for (let pass = 0; pass < 60; pass++){
      let changed = false;
      for (const n of this.order){
        const v = this.evalNode(n); const o = this.out.get(n.id);
        for (let i = 0; i < v.length; i++) if (o[i] !== v[i]){ o[i] = v[i]; changed = true; }
      }
      if (!changed){ this.stable = true; return true; }
    }
    this.stable = false; return false;
  }
  setInputs(a){ this.ins.forEach((n, i) => this.ov.set(n.id, a[i] | 0)); }
  readOutputs(){ return this.outs.map(n => this.inv(n, 0)); }
  val(id){ const n = this.byId.get(id); if (!n) return 0; return n.type === "OUT" ? this.inv(n, 0) : (this.out.get(id) || [0])[0]; }
}

function truthTable(c){
  const {ins, outs} = ioOrder(c);
  if (!ins.length || !outs.length) return {msg:"Add at least one switch and one light to see a truth table."};
  if (c.nodes.some(n => n.type === "CLOCK")) return {msg:"This circuit has a clock, so its outputs change over time. Remove the clock to see a truth table."};
  if (ins.length > 6) return {msg:`${ins.length} inputs would need ${2 ** ins.length} rows. Use the switches to explore it instead.`};
  const N = ins.length, rows = []; let memory = false;
  for (let r = 0; r < (1 << N); r++){
    const bits = []; for (let i = 0; i < N; i++) bits.push((r >> (N - 1 - i)) & 1);
    const s = new Sim(c); s.setInputs(bits); s.settle(); memory = memory || s.memory;
    rows.push({bits, outs: s.readOutputs()});
  }
  return { ins: ins.map(n => n.label || "in"), outs: outs.map(n => n.label || "out"), insNodes: ins, rows, memory };
}

/* ---------- rendering ---------- */
function gateBody(type){
  const AND = '<path d="M0,0 H28 A20,20 0 0 1 28,40 H0 Z"/>';
  const OR = '<path d="M0,0 Q12,20 0,40 Q30,40 48,20 Q30,0 0,0 Z"/>';
  const XB = '<path class="xb" d="M-6,0 Q6,20 -6,40"/>';
  const bub = x => `<circle cx="${x}" cy="20" r="4"/>`;
  switch (type){
    case "AND": return {svg:AND, end:48};
    case "NAND": return {svg:AND + bub(52), end:56};
    case "OR": return {svg:OR, end:48};
    case "NOR": return {svg:OR + bub(52), end:56};
    case "XOR": return {svg:XB + OR, end:48};
    case "XNOR": return {svg:XB + OR + bub(52), end:56};
    case "NOT": return {svg:'<path d="M0,4 L34,20 L0,36 Z"/>' + bub(38), end:42};
  }
  return {svg:"", end:40};
}
function nodeSVG(n, s, ed, sel){
  const g = geom(n); const outs = s ? (s.out.get(n.id) || []) : [];
  const inV = i => s ? s.inv(n, i) : 0;
  let b = "", on = false;
  switch (n.type){
    case "IN":
      on = !!outs[0];
      b += `<line class="stub${on ? " on" : ""}" x1="44" y1="16" x2="52" y2="16"/>
        <rect class="sw-track" x="0" y="2" width="44" height="28" rx="14"/>
        <circle class="knob" cx="${on ? 30 : 14}" cy="16" r="11"/>
        <text class="lbl" x="22" y="-8" text-anchor="middle">${esc(n.label)}</text>`;
      break;
    case "CLOCK":
      on = !!outs[0];
      b += `<line class="stub${on ? " on" : ""}" x1="44" y1="16" x2="52" y2="16"/>
        <rect class="clk-body" x="0" y="2" width="44" height="28" rx="8"/>
        <path class="clk-wave" d="M7,22 h7 v-12 h8 v12 h8 v-12 h7"/>
        <text class="lbl" x="22" y="-8" text-anchor="middle">${esc(n.label || "CLK")}</text>`;
      break;
    case "HEX": {
      const bits = [0, 1, 2, 3].map(inV), v = bits.reduce((t, b, i) => t | (b << i), 0), on = SEG7[v];
      const S = {a:[30, 12, 26, 6], b:[56, 16, 6, 30], c:[56, 50, 6, 30], d:[30, 80, 26, 6], e:[24, 50, 6, 30], f:[24, 16, 6, 30], g:[30, 46, 26, 6]};
      g.ins.forEach((p, i) => { b += `<line class="stub${bits[i] ? " on" : ""}" x1="0" y1="${p.y}" x2="10" y2="${p.y}"/>`; });
      b += `<rect class="hex-body" x="10" y="0" width="60" height="96" rx="10"/>`;
      for (const k in S){ const r = S[k]; b += `<rect class="${on.includes(k) ? "sg-on" : "sg-off"}" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="2.5"/>`; }
      g.ins.forEach(p => { b += `<text class="hex-pin" x="14" y="${p.y + 3}">${p.label}</text>`; });
      b += `<text class="cap" x="40" y="112" text-anchor="middle">0x${v.toString(16).toUpperCase()} = ${v}</text>`;
      break;
    }
    case "OUT": {
      const v = inV(0);
      b += `<line class="stub${v ? " on" : ""}" x1="0" y1="16" x2="13" y2="16"/>
        <circle class="led${v ? " on" : ""}" cx="26" cy="16" r="13"/><text class="led-v" x="26" y="20" text-anchor="middle">${v}</text>
        <text class="lbl" x="46" y="20">${esc(n.label)}</text>`;
      break;
    }
    case "CHIP": {
      const d = lib.get(n.chip);
      g.ins.forEach((p, i) => { b += `<line class="stub${inV(i) ? " on" : ""}" x1="0" y1="${p.y}" x2="10" y2="${p.y}"/>`; });
      g.outs.forEach((p, i) => { b += `<line class="stub${outs[i] ? " on" : ""}" x1="${g.w - 10}" y1="${p.y}" x2="${g.w}" y2="${p.y}"/>`; });
      b += `<rect class="chip-body${d ? "" : " missing"}" x="10" y="0" width="${g.w - 20}" height="${g.h}" rx="10"/>
        <text class="chip-name" x="${g.w / 2}" y="18" text-anchor="middle">${esc(n.chip)}${d ? "" : " (missing)"}</text>`;
      g.ins.forEach(p => { b += `<text class="chip-pin" x="17" y="${p.y + 3.5}">${esc(p.label)}</text>`; });
      g.outs.forEach(p => { b += `<text class="chip-pin" x="${g.w - 17}" y="${p.y + 3.5}" text-anchor="end">${esc(p.label)}</text>`; });
      break;
    }
    default: {
      const gb = gateBody(n.type);
      g.ins.forEach((p, i) => { b += `<line class="stub${inV(i) ? " on" : ""}" x1="0" y1="${p.y}" x2="16" y2="${p.y}"/>`; });
      b += `<line class="stub${outs[0] ? " on" : ""}" x1="${10 + gb.end}" y1="20" x2="${g.w}" y2="20"/>`;
      b += `<g class="gate" transform="translate(10,0)">${gb.svg}</g>`;
      b += `<text class="cap" x="${g.w / 2}" y="54" text-anchor="middle">${n.type}</text>`;
    }
  }
  g.ins.forEach((p, i) => {
    b += `<circle class="pin${inV(i) ? " on" : ""}" cx="${p.x}" cy="${p.y}" r="4"/>`;
    if (ed) b += `<circle class="pin-hit" data-pin="in" data-node="${esc(n.id)}" data-idx="${i}" cx="${p.x}" cy="${p.y}" r="10"/>`;
  });
  g.outs.forEach((p, i) => {
    b += `<circle class="pin${outs[i] ? " on" : ""}" cx="${p.x}" cy="${p.y}" r="4"/>`;
    if (ed) b += `<circle class="pin-hit" data-pin="out" data-node="${esc(n.id)}" data-idx="${i}" cx="${p.x}" cy="${p.y}" r="10"/>`;
  });
  const selBox = sel ? `<rect class="sel-box" x="-8" y="${n.type === "IN" || n.type === "CLOCK" ? -24 : -8}" width="${g.w + 16}" height="${g.h + (n.type === "IN" || n.type === "CLOCK" ? 32 : 16)}" rx="10"/>` : "";
  return `<g class="node t-${n.type}${on ? " on" : ""}${sel ? " sel" : ""}${!ed && GATES[n.type] ? " peek" : ""}" data-node="${esc(n.id)}" transform="translate(${n.x},${n.y})">${selBox}${b}</g>`;
}
function curve(x1, y1, x2, y2){
  const dx = Math.max(30, Math.abs(x2 - x1) * 0.5);
  return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
}

function circuitMarkup(c, s, ed, sel){
  let ws = "", ns = "";
  for (const w of c.wires){
    const a = s.byId.get(w.from[0]), b = s.byId.get(w.to[0]); if (!a || !b) continue;
    const p1 = geom(a).outs[w.from[1]], p2 = geom(b).ins[w.to[1]]; if (!p1 || !p2) continue;
    const on = (s.out.get(a.id) || [])[w.from[1]];
    const d = curve(a.x + p1.x, a.y + p1.y, b.x + p2.x, b.y + p2.y);
    const isSel = sel && sel.wire === w.id;
    ws += `<g class="wire${on ? " on" : ""}${isSel ? " sel" : ""}" data-wire="${esc(w.id)}"><path class="hit" d="${d}"/><path class="line" d="${d}"/></g>`;
  }
  for (const n of c.nodes) ns += nodeSVG(n, s, ed, sel && sel.node === n.id);
  return ws + ns;
}
function circBBox(c){
  const ns = c.nodes; if (!ns.length) return {x:-200, y:-150, w:600, h:400};
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of ns){
    const g = geom(n);
    const right = n.type === "OUT" ? 52 + String(n.label || "").length * 7.5 : 12;
    x0 = Math.min(x0, n.x - 14); y0 = Math.min(y0, n.y - 26);
    x1 = Math.max(x1, n.x + g.w + right); y1 = Math.max(y1, n.y + g.h + (GATES[n.type] || n.type === "HEX" ? 22 : 12));
  }
  return {x:x0, y:y0, w:x1 - x0, h:y1 - y0};
}

/* ---------- board (svg canvas controller) ---------- */
class Board {
  constructor(svg){
    this.svg = svg; this.layer = svg.querySelector("#layer"); this.temp = svg.querySelector("#temp");
    this.doc = null; this.sim = null; this.simDoc = null; this.editable = false; this.sel = null; this.drag = null; this.ver = 0;
    this.cb = { structure(){}, values(){}, select(){}, drop(){}, gate(){} };
    svg.addEventListener("pointerdown", e => this.down(e));
    svg.addEventListener("pointermove", e => this.move(e));
    svg.addEventListener("pointerup", e => this.up(e));
    svg.addEventListener("pointercancel", () => { this.drag = null; this.temp.setAttribute("d", ""); });
    svg.addEventListener("wheel", e => this.wheel(e), {passive:false});
    svg.addEventListener("dragover", e => { if (this.editable){ e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
    svg.addEventListener("drop", e => {
      if (!this.editable) return; e.preventDefault();
      let d; try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (_) { return; }
      this.cb.drop(d, this.pt(e));
    });
  }
  get circ(){ return this.doc.circ; }
  load(doc, editable){
    this.doc = doc; this.editable = editable; this.sel = null;
    this.svg.classList.toggle("editable", editable);
    this.rebuild();
    if (!doc.vb) this.fit(); else this.applyVB();
    this.render(); this.cb.select();
  }
  rebuild(){
    this.sim = new Sim(this.circ, 0, this.simDoc === this.doc ? this.sim : null);
    this.simDoc = this.doc; this.sim.settle(); this.ver++;
  }
  pt(e, inv){
    const m = inv || (this.svg.getScreenCTM() && this.svg.getScreenCTM().inverse());
    if (!m) return {x:0, y:0};
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return {x:p.x, y:p.y};
  }
  bbox(){ return circBBox(this.circ); }
  fit(){
    const b = this.bbox(); const pad = 36;
    let w = Math.max(b.w + pad * 2, 320), h = Math.max(b.h + pad * 2, 220);
    this.doc.vb = {x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - h / 2, w, h};
    this.applyVB();
  }
  applyVB(){ const v = this.doc.vb; this.svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); }
  zoomAt(f, p){
    const v = this.doc.vb; const nw = Math.min(6000, Math.max(160, v.w * f)); const k = nw / v.w;
    v.x = p.x - (p.x - v.x) * k; v.y = p.y - (p.y - v.y) * k; v.w *= k; v.h *= k; this.applyVB();
  }
  zoomBy(f){ const v = this.doc.vb; this.zoomAt(f, {x:v.x + v.w / 2, y:v.y + v.h / 2}); }
  wheel(e){ e.preventDefault(); this.zoomAt(Math.exp(e.deltaY * 0.0012), this.pt(e)); }
  render(){ this.layer.innerHTML = circuitMarkup(this.circ, this.sim, this.editable, this.sel); }
  pushUndo(){
    if (!this.editable) return;
    this.doc.undo.push(JSON.stringify(this.circ)); if (this.doc.undo.length > 100) this.doc.undo.shift();
    this.doc.redo = [];
  }
  mutate(fn){ this.pushUndo(); fn(this.circ); this.rebuild(); this.render(); this.cb.structure(); }
  history(dir){
    const from = dir < 0 ? this.doc.undo : this.doc.redo, to = dir < 0 ? this.doc.redo : this.doc.undo;
    if (!from.length) return;
    to.push(JSON.stringify(this.circ)); this.doc.circ = JSON.parse(from.pop());
    this.sel = null; this.rebuild(); this.render(); this.cb.structure(); this.cb.select();
  }
  deleteSel(){
    if (!this.sel || !this.editable) return;
    const sel = this.sel;
    this.mutate(c => {
      if (sel.node){ c.nodes = c.nodes.filter(n => n.id !== sel.node); c.wires = c.wires.filter(w => w.from[0] !== sel.node && w.to[0] !== sel.node); }
      else if (sel.wire){ c.wires = c.wires.filter(w => w.id !== sel.wire); }
    });
    this.sel = null; this.render(); this.cb.select();
  }
  select(sel){ this.sel = sel; this.render(); this.cb.select(); }
  toggle(n){ n.value = n.value ? 0 : 1; this.sim.settle(); this.render(); this.cb.values(); }
  tick(){
    const clocks = this.circ.nodes.filter(n => n.type === "CLOCK"); if (!clocks.length) return;
    clocks.forEach(n => n.value = n.value ? 0 : 1); this.sim.settle(); this.render(); this.cb.values();
  }
  down(e){
    if (e.button !== undefined && e.button !== 0) return;
    const t = e.target;
    const pinEl = t.closest && t.closest("[data-pin]");
    const nodeEl = t.closest && t.closest("[data-node]");
    const wireEl = t.closest && t.closest("[data-wire]");
    try { this.svg.setPointerCapture(e.pointerId); } catch (_) {}
    if (pinEl && this.editable){
      const n = this.sim.byId.get(pinEl.dataset.node); const g = geom(n); const idx = +pinEl.dataset.idx; const dir = pinEl.dataset.pin;
      const p = (dir === "out" ? g.outs : g.ins)[idx];
      this.drag = {kind:"wire", node:n.id, dir, idx, x0:n.x + p.x, y0:n.y + p.y, moved:false};
      return;
    }
    if (nodeEl){
      const n = this.sim.byId.get(nodeEl.dataset.node); if (!n) return;
      const p = this.pt(e);
      this.drag = {kind:"node", n, dx:p.x - n.x, dy:p.y - n.y, sx:e.clientX, sy:e.clientY, moved:false, before:JSON.stringify(this.circ)};
      return;
    }
    if (wireEl && this.editable){ this.select({wire:wireEl.dataset.wire}); this.drag = null; return; }
    const m = this.svg.getScreenCTM(); const inv = m && m.inverse();
    this.drag = {kind:"pan", inv, p0:this.pt(e, inv), vb0:{...this.doc.vb}, sx:e.clientX, sy:e.clientY, moved:false};
  }
  move(e){
    const d = this.drag; if (!d) return;
    if (Math.abs(e.clientX - (d.sx ?? e.clientX)) + Math.abs(e.clientY - (d.sy ?? e.clientY)) > 4) d.moved = true;
    if (d.kind === "node"){
      if (!d.moved || !this.editable) return;
      const p = this.pt(e); d.n.x = snap(p.x - d.dx); d.n.y = snap(p.y - d.dy); this.render();
    } else if (d.kind === "wire"){
      d.moved = true; const p = this.pt(e);
      this.temp.setAttribute("d", d.dir === "out" ? curve(d.x0, d.y0, p.x, p.y) : curve(p.x, p.y, d.x0, d.y0));
    } else if (d.kind === "pan"){
      if (!d.moved) return;
      const p = this.pt(e, d.inv); const v = this.doc.vb;
      v.x = d.vb0.x - (p.x - d.p0.x); v.y = d.vb0.y - (p.y - d.p0.y); this.applyVB();
    }
  }
  up(e){
    const d = this.drag; this.drag = null; if (!d) return;
    if (d.kind === "node"){
      if (!d.moved){
        if (d.n.type === "IN") this.toggle(d.n);
        else if (!this.editable && GATES[d.n.type]) this.cb.gate(d.n);
        if (this.editable) this.select({node:d.n.id});
      } else if (this.editable){
        this.doc.undo.push(d.before); this.doc.redo = []; this.cb.structure(true);
      }
    } else if (d.kind === "wire"){
      this.temp.setAttribute("d", "");
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const pe = el && el.closest && el.closest("[data-pin]");
      if (pe && pe.dataset.pin !== d.dir && pe.dataset.node !== d.node){
        const other = [pe.dataset.node, +pe.dataset.idx];
        const from = d.dir === "out" ? [d.node, d.idx] : other;
        const to = d.dir === "out" ? other : [d.node, d.idx];
        this.mutate(c => {
          c.wires = c.wires.filter(w => !(w.to[0] === to[0] && w.to[1] === to[1]));
          c.wires.push({id:nid("w"), from, to});
        });
      } else if (!pe && d.dir === "in"){
        const has = this.circ.wires.some(w => w.to[0] === d.node && w.to[1] === d.idx);
        if (has) this.mutate(c => { c.wires = c.wires.filter(w => !(w.to[0] === d.node && w.to[1] === d.idx)); });
      }
    } else if (d.kind === "pan"){
      if (!d.moved && this.sel) this.select(null);
    }
  }
}

/* ---------- circuits ---------- */
function B(){
  const c = {nodes:[], wires:[]};
  const api = {
    in(id, label, x, y, v){ c.nodes.push({id, type:"IN", label, x, y, value:v ? 1 : 0}); return api; },
    out(id, label, x, y){ c.nodes.push({id, type:"OUT", label, x, y}); return api; },
    g(id, type, x, y){ c.nodes.push({id, type, x, y}); return api; },
    chip(id, name, x, y){ c.nodes.push({id, type:"CHIP", chip:name, x, y}); return api; },
    w(a, ai, b, bi){ c.wires.push({id:"w" + c.wires.length, from:[a, ai], to:[b, bi]}); return api; },
    done(){ return c; }
  };
  return api;
}

function adder4(){
  const b = B(); const A = [1, 0, 1, 0], Bb = [1, 0, 0, 1]; // 5 + 9
  for (let i = 0; i < 4; i++){
    const y = i * 140;
    b.in("a" + i, "A" + i, 0, y + 16, A[i]).in("b" + i, "B" + i, 0, y + 76, Bb[i]);
    b.chip("fa" + i, "FULL ADDER", 200, y).out("s" + i, "S" + i, 360, y + 16);
    b.w("a" + i, 0, "fa" + i, 0).w("b" + i, 0, "fa" + i, 1).w("fa" + i, 0, "s" + i, 0);
    if (i > 0) b.w("fa" + (i - 1), 1, "fa" + i, 2);
  }
  b.out("co", "Carry", 360, 456).w("fa3", 1, "co", 0);
  return b.done();
}

function sanitizeCirc(c){
  if (!c || !Array.isArray(c.nodes) || !Array.isArray(c.wires)) return null;
  const ok = t => GATES[t] || IO_TYPES.includes(t);
  const nodes = c.nodes.filter(n => n && ok(n.type) && n.id != null).map(n => {
    const o = {id:String(n.id), type:n.type, x:+n.x || 0, y:+n.y || 0};
    if (n.label != null) o.label = String(n.label).slice(0, 12);
    if (n.type === "IN" || n.type === "CLOCK") o.value = n.value ? 1 : 0;
    if (n.type === "CHIP") o.chip = String(n.chip || "").slice(0, 12);
    return o;
  });
  const wires = c.wires.filter(w => w && Array.isArray(w.from) && Array.isArray(w.to)).map(w => ({id:String(w.id || nid("w")), from:[String(w.from[0]), +w.from[1] || 0], to:[String(w.to[0]), +w.to[1] || 0]}));
  return {nodes, wires};
}
function addChipsInOrder(list){
  let pending = list.filter(c => c && typeof c.name === "string").map(c => ({name:c.name.trim().toUpperCase().slice(0, 12), circuit:sanitizeCirc(c.circuit)}))
    .filter(c => c.name && c.circuit && !(lib.get(c.name) && lib.get(c.name).builtin));
  let added = 0, progress = true;
  while (pending.length && progress){
    progress = false;
    pending = pending.filter(c => {
      const deps = c.circuit.nodes.filter(n => n.type === "CHIP").map(n => n.chip);
      if (deps.every(x => x !== c.name && lib.has(x))){ defineChip(c.name, c.circuit); added++; progress = true; return false; }
      return true;
    });
  }
  return {added, skipped:pending.length};
}
let saveTimer = 0;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        chips:[...lib.values()].filter(d => !d.builtin).map(d => ({name:d.name, circuit:d.circuit})),
        circuit:state.buildDoc.circ, mode:state.mode, lesson:state.lesson, lab:state.lab }));
    } catch (_) {}
  }, 250);
}
function restore(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (!s){ state.firstVisit = true; return; }
    if (Array.isArray(s.chips)) addChipsInOrder(s.chips);
    const c = sanitizeCirc(s.circuit); if (c) state.buildDoc.circ = c;
    if (["build", "learn", "zoom", "dev"].includes(s.mode)) state.mode = s.mode;
    if (Number.isInteger(s.lab) && s.lab >= 0 && s.lab < 11) state.lab = s.lab;
    if (Number.isInteger(s.lesson) && s.lesson >= 0 && s.lesson < LESSONS.length) state.lesson = s.lesson;
  } catch (_) {}
}

  if (type === "OUT") return `<svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><circle cx="22" cy="13" r="9" fill="var(--signal)" filter="url(#glow)"/></svg>`;
  if (type === "HEX") return `<svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><rect x="10" y="0" width="24" height="26" rx="4" fill="#1A1D24"/><path d="M16 4h12M29 5v7M29 14v7M16 22h12M15 14v7M15 5v7M16 13h12" stroke="var(--signal)" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  if (type === "CLOCK") return `<svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><rect x="4" y="3" width="36" height="20" rx="6" fill="var(--gate-fill)" stroke="var(--gate-stroke)" stroke-width="1.4"/><path d="M9 17h6v-8h7v8h7v-8h6" fill="none" stroke="var(--gate-stroke)" stroke-width="1.4"/></svg>`;
  const gb = gateBody(type);
  return `<svg width="48" height="28" viewBox="-6 -4 74 48" aria-hidden="true"><g class="gate" transform="translate(4,0)">${gb.svg}</g></svg>`;
}

let addCount = 0;
function nextLabel(type){
  const used = new Set(board.circ.nodes.filter(n => n.type === type).map(n => n.label));
  const pool = type === "IN" ? "ABCDEFGHJKLMNP".split("") : type === "OUT" ? ["X", "Y", "Z", "W", "Q", "R", "S", "T"] : ["CLK", "CLK2", "CLK3"];
  return pool.find(l => !used.has(l)) || (type === "OUT" ? "Out" : "In") + (used.size + 1);
}
function addPart(d, p){
  if (state.mode !== "build") return;
  if (d.type === "CHIP" && !lib.has(d.chip)) return;
  if (!p){ const v = board.doc.vb; const k = (addCount++ % 6) * 20; p = {x:v.x + v.w / 2 + k, y:v.y + v.h / 2 + k}; }
  const n = {id:nid(), type:d.type, x:0, y:0};
  if (d.type === "IN" || d.type === "OUT" || d.type === "CLOCK") n.label = nextLabel(d.type);
  if (d.type === "IN" || d.type === "CLOCK") n.value = 0;
  if (d.type === "CHIP") n.chip = d.chip;
  const g = geom(n); n.x = snap(p.x - g.w / 2); n.y = snap(p.y - g.h / 2);
  board.mutate(c => { c.nodes.push(n); });
  board.select({node:n.id});
}
board.cb.drop = (d, p) => addPart(d, p);

function tableHTML(){
  if (state.mode === "learn"){ const L = LESSONS[state.lesson]; if (L.noTable) return `<p class="note">${esc(L.noTable)}</p>`; }
  if (board.ttVer !== board.ver){ board.tt = truthTable(board.circ); board.ttVer = board.ver; }
  const r = board.tt; if (r.msg) return `<p class="note">${esc(r.msg)}</p>`;
  const cur = r.insNodes.map(n => (board.sim.byId.get(n.id) || n).value ? 1 : 0);
  const idx = cur.reduce((t, b) => t * 2 + b, 0);
  const cell = (b, sep) => `<td class="${b ? "one" : "zero"}${sep ? " sep" : ""}">${b}</td>`;
  return `<div class="tt-wrap"><table class="tt"><thead><tr>${r.ins.map(l => `<th scope="col">${esc(l)}</th>`).join("")}${r.outs.map((l, i) => `<th scope="col"${i === 0 ? ' class="sep"' : ""}>${esc(l)}</th>`).join("")}</tr></thead>
    <tbody>${r.rows.map((row, i) => `<tr${i === idx ? ' class="cur"' : ""}>${row.bits.map(b => cell(b)).join("")}${row.outs.map((b, j) => cell(b, j === 0)).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="note">The highlighted row matches your switches right now.${r.memory ? " This circuit has a feedback loop, so the table shows results starting from all zeros." : ""}</p>`;
}
function statsText(){

    if (n.type === "HEX") info = `<p class="note">Reads 4 bits as one hexadecimal digit, 0 to F. The top pin is worth 1, then 2, 4 and 8. Two of these side by side show a whole byte.</p>`;

    I.innerHTML = `<h2 class="sec">Selected</h2><div class="insp"><h3>${esc(title)}</h3>
      ${named ? `<label class="f" for="inspLabel">Name<input type="text" id="inspLabel" maxlength="10" value="${esc(n.label || "")}"></label>` : ""}
      ${info}
      <div class="row">${n.type === "CHIP" && lib.get(n.chip) ? `<button class="btn" id="lookInside">Look inside</button>` : ""}${TVDEF[n.type] ? `<button class="btn" id="seeT">See transistors</button>` : ""}<button class="btn danger" id="inspDel">Delete</button></div>
</div>`;
    const st = $("#seeT"); if (st) st.addEventListener("click", () => openTVFor(n));

    }

    $("#inspDel").addEventListener("click", () => board.deleteSel());
    return;
  }
  I.innerHTML = `<h2 class="sec">How to build a chip</h2>
    <ol class="help">
      <li>Drag parts onto the board, or tap a part to add it.</li>
      <li>Wire them: drag from an output dot (right side) to an input dot (left side).</li>

    <p class="note">The starter circuit is XOR built from four NAND gates. Try saving it as <b>MY XOR</b>.</p>`;

$("#saveChipBtn").addEventListener("click", () => {
  const c = board.circ; const io = ioOf(c);
  if (!io.ins.length || !io.outs.length){ toast("Add at least one switch (input) and one light (output) first."); return; }
  if (c.nodes.some(n => n.type === "CLOCK")){ toast("Clocks can't go inside a chip. Replace them with switches."); return; }
  if (c.nodes.some(n => n.type === "CHIP" && !lib.has(n.chip))){ toast("This circuit uses a chip that no longer exists. Remove it first."); return; }
  openModal("Save as chip", `
    <label class="f" for="chipName">Chip name<input type="text" id="chipName" maxlength="12" value="${esc(state.editingName)}" placeholder="e.g. MY XOR" autocomplete="off"></label>

    <p class="note">Pins follow the switches and lights from top to bottom. Up to 12 letters, numbers, spaces or dashes.</p>
    <p class="err" id="chipErr"></p>`,
    [{label:"Cancel"}, {label:"Save chip", primary:true, onClick:() => {
      const raw = $("#chipName").value.trim().toUpperCase(); const err = $("#chipErr");
      if (!/^[A-Z0-9 _-]{1,12}$/.test(raw)){ err.textContent = "Use 1 to 12 letters, numbers, spaces or dashes."; return false; }
      const ex = lib.get(raw);
      if (ex && ex.builtin){ err.textContent = `${raw} is a built-in chip. Pick another name.`; return false; }
      if (usesChip(c, raw)){ err.textContent = `This circuit uses ${raw} inside it, so it can't be saved as ${raw}.`; return false; }
      defineChip(raw, clone(c)); state.editingName = raw;
      renderLeft(); board.rebuild(); board.render(); renderRight(); persist();
      toast(ex ? `Updated ${raw}. Every copy of it now uses the new design.` : `Saved ${raw}. Find it under My chips.`);
    }}]);

function askDeleteChip(name){
  const users = [...lib.values()].filter(d => d.name !== name && d.circuit.nodes.some(n => n.type === "CHIP" && n.chip === name)).map(d => d.name);
  if (users.length){ toast(`${name} is used inside ${users.join(", ")}. Delete ${users.length > 1 ? "those" : "that"} first.`); return; }
  if (state.buildDoc.circ.nodes.some(n => n.type === "CHIP" && n.chip === name)){ toast(`${name} is on the board. Remove it from the board first.`); return; }
  openModal(`Delete ${name}?`, `<p class="note">The chip is removed from My chips. This can't be undone.</p>`,
    [{label:"Cancel"}, {label:"Delete chip", primary:true, onClick:() => { lib.delete(name); renderLeft(); persist(); toast(`Deleted ${name}.`); }}]);
}

        toast(`Imported ${r.added} chip${r.added === 1 ? "" : "s"}${c ? " and the circuit" : ""}.${r.skipped ? ` Skipped ${r.skipped} that referenced missing chips.` : ""}`);
     }}]);
});

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if ($("#scrim").classList.contains("open")){ if (e.key === "Escape") closeModal(); return; }
  if (!$("#tv").hidden){ if (e.key === "Escape") closeTV(); return; }
  if (state.mode === "zoom"){ if (e.key === "Escape" && Z.stack.length > 1){ Z.stack.pop(); zRender(); } return; }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing || state.mode === "dev") return;
  if (!e.metaKey && !e.ctrlKey && !e.altKey && e.key.length === 1 && /[a-z0-9]/i.test(e.key)){
    const k = e.key.toUpperCase();
    const sw = board.circ.nodes.find(n => n.type === "IN" && String(n.label || "").toUpperCase() === k);
    if (sw){ e.preventDefault(); board.toggle(sw); return; }
  }
  if (state.mode !== "build") return;
  if (e.key === "Delete" || e.key === "Backspace"){ if (board.sel){ e.preventDefault(); board.deleteSel(); } }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); board.history(e.shiftKey ? 1 : -1); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "y"){ e.preventDefault(); board.history(1); }
  else if (e.key === "Escape"){ board.select(null); }
});
